<template>
    <lightning-card title="Manage Training Video" icon-name="custom:custom52">
        <div class="slds-p-horizontal_medium slds-p-bottom_medium mgr">
            <!-- ── Video file ── -->
            <div class="block">
                <div class="block-title">Video file</div>
                <div class="file-row">
                    <template lwc:if={hasFile}>
                        <lightning-icon icon-name="doctype:video" size="small"></lightning-icon>
                        <span class="file-name">{currentFileLabel}</span>
                    </template>
                    <template lwc:else>
                        <span class="muted">No video uploaded yet.</span>
                    </template>
                </div>
                <lightning-file-upload
                    label={uploadLabel}
                    name="videoUploader"
                    accept={acceptedFormats}
                    record-id={recordId}
                    onuploadfinished={handleUploadFinished}
                ></lightning-file-upload>
                <p class="hint">
                    One video per record; a new upload replaces the current one. Use <strong>MP4 (H.264)</strong>.
                    Max <strong>150&nbsp;MB</strong> — larger files are rejected. To shrink a big video, compress it first
                    with <strong>HandBrake</strong> (free): open the file → preset <em>Fast&nbsp;1080p30</em> (or 720p for smaller) → Web&nbsp;Optimized → Start Encode.
                </p>
            </div>

            <!-- ── Assign audience ── -->
            <div class="block">
                <div class="block-title">Make mandatory for</div>

                <lightning-dual-listbox
                    label="Profiles"
                    source-label="Available profiles"
                    selected-label="Assigned profiles"
                    options={profileOptions}
                    value={selectedProfileIds}
                    onchange={handleProfileChange}
                    field-level-help="Everyone with these profiles will be assigned this video."
                ></lightning-dual-listbox>

                <div class="user-search">
                    <lightning-input
                        type="search"
                        label="Specific users"
                        placeholder="Search users by name…"
                        value={userTerm}
                        onchange={handleUserSearch}
                    ></lightning-input>
                    <template lwc:if={hasUserResults}>
                        <ul class="results">
                            <template for:each={userResults} for:item="u">
                                <li key={u.id} class="result" data-id={u.id} data-label={u.label} onclick={handleAddUser}>
                                    <lightning-icon icon-name="utility:adduser" size="x-small"></lightning-icon>
                                    <span>{u.label}</span>
                                </li>
                            </template>
                        </ul>
                    </template>

                    <template lwc:if={selectedUsers.length}>
                        <div class="chips">
                            <template for:each={selectedUsers} for:item="u">
                                <span key={u.id} class="chip">
                                    {u.label}
                                    <button class="chip-x" data-id={u.id} onclick={handleRemoveUser} title="Remove">
                                        <lightning-icon icon-name="utility:close" size="xx-small"></lightning-icon>
                                    </button>
                                </span>
                            </template>
                        </div>
                    </template>
                </div>

                <lightning-input
                    type="checkbox"
                    label="Email these users a notification when assigned"
                    checked={notifyByEmail}
                    onchange={handleNotifyToggle}
                    class="notify-check"
                ></lightning-input>

                <div class="assign-actions">
                    <lightning-button
                        variant="brand"
                        label="Assign as mandatory"
                        disabled={assignDisabled}
                        onclick={handleAssign}
                    ></lightning-button>
                    <template lwc:if={isAssigning}>
                        <lightning-spinner alternative-text="Assigning" size="small"></lightning-spinner>
                    </template>
                </div>
            </div>

            <!-- ── Tracking ── -->
            <div class="block">
                <div class="track-head">
                    <div class="block-title">Who's completed it</div>
                    <template lwc:if={hasAssignments}>
                        <lightning-button
                            label="Remove all"
                            variant="destructive-text"
                            icon-name="utility:delete"
                            onclick={handleRemoveAll}
                        ></lightning-button>
                    </template>
                </div>
                <p class="summary">{summaryLabel}</p>
                <template lwc:if={hasAssignments}>
                    <div class="assignee-search">
                        <lightning-input
                            type="search"
                            variant="label-hidden"
                            placeholder="Search by user name…"
                            value={assigneeSearch}
                            onchange={handleAssigneeSearch}
                        ></lightning-input>
                    </div>
                    <lightning-datatable
                        key-field="id"
                        data={pagedAssignments}
                        columns={columns}
                        sorted-by={sortedBy}
                        sorted-direction={sortedDirection}
                        onsort={handleSort}
                        hide-checkbox-column
                        onrowaction={handleRowAction}
                    ></lightning-datatable>
                    <template lwc:if={showPagination}>
                        <div class="pager">
                            <lightning-button-icon
                                icon-name="utility:chevronleft"
                                alternative-text="Previous"
                                disabled={isFirstPage}
                                onclick={handlePrevPage}
                            ></lightning-button-icon>
                            <span class="pager-info tnum">{pageInfo}</span>
                            <lightning-button-icon
                                icon-name="utility:chevronright"
                                alternative-text="Next"
                                disabled={isLastPage}
                                onclick={handleNextPage}
                            ></lightning-button-icon>
                        </div>
                    </template>
                </template>
                <template lwc:else>
                    <p class="muted">No views or assignments yet.</p>
                </template>
            </div>
        </div>
    </lightning-card>
</template>
