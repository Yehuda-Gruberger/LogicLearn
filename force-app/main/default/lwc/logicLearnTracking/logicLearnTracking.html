<template>
    <template lwc:if={people}>
        <div class="people-panel">
            <header class="people-head"><div><span class="people-kicker">Audience activity</span><h2>People</h2></div><span class="people-count">{peopleCountLabel}</span></header>
            <lightning-input class="people-search" type="search" variant="label-hidden" label="Search learners" placeholder="Search learners" value={peopleSearch} onchange={handlePeopleSearch}></lightning-input>
            <template lwc:if={loading}><div class="loading"><lightning-spinner alternative-text="Loading learners" size="small"></lightning-spinner></div></template>
            <template lwc:elseif={hasRows}>
                <div class="people-list">
                    <template for:each={filteredPeople} for:item="person">
                        <article class="person" key={person.userId}>
                            <span class="person-avatar">{person.initials}</span>
                            <div class="person-copy"><strong>{person.userName}</strong><small>{person.activityLabel}</small><span class={person.statusClass}>{person.status}</span></div>
                        </article>
                    </template>
                </div>
            </template>
            <template lwc:else><div class="people-empty"><lightning-icon icon-name="utility:people" size="medium"></lightning-icon><p>No required learners yet.</p></div></template>
            <footer class="people-actions"><lightning-combobox variant="label-hidden" label="Reminder channel" value={reminderChannel} options={channelOptions} onchange={handleChannel}></lightning-combobox><lightning-button variant="brand" label="Remind" icon-name="utility:notification" onclick={sendReminder} disabled={sending}></lightning-button></footer>
        </div>
    </template>
    <template lwc:else>
        <div class="panel">
            <header><div><h2>Learner activity</h2><p>See who opened, watched, and completed this tutorial.</p></div><lightning-button label="Export CSV" icon-name="utility:download" onclick={exportCsv} disabled={loading}></lightning-button></header>
            <div class={toolbarClass}>
                <template lwc:if={compact}></template>
                <template lwc:else><c-logic-learn-picker label="Tutorial" placeholder="Search tutorials" options={videos} value={videoId} onchange={handleVideo}></c-logic-learn-picker></template>
                <lightning-combobox label="Reminder channel" value={reminderChannel} options={channelOptions} onchange={handleChannel}></lightning-combobox>
                <lightning-button variant="brand" label="Send reminder" icon-name="utility:notification" onclick={sendReminder} disabled={sending}></lightning-button>
            </div>
            <template lwc:if={loading}><div class="loading"><lightning-spinner alternative-text="Loading tracking" size="small"></lightning-spinner></div></template>
            <template lwc:elseif={hasRows}><lightning-datatable key-field="userId" data={rows} columns={columns} hide-checkbox-column></lightning-datatable></template>
            <template lwc:else><p class="empty">No required learners have activity for this tutorial yet.</p></template>
        </div>
    </template>
</template>
