<template>
    <div class={appClass}>
        <!-- ===== Contextual rail ===== -->
        <aside class="rail">
            <template lwc:if={isAdminMode}>
                <div class="admin-rail-head">
                    <span class="admin-rail-mark"><lightning-icon icon-name="utility:setup" size="small" variant="inverse"></lightning-icon></span>
                    <div><span>Workspace</span><strong>Admin Studio</strong></div>
                </div>
                <nav class="admin-nav" aria-label="Administration">
                    <button class={adminTutorialsClass} data-section="tutorials" onclick={handleAdminSection}>
                        <span class="admin-nav-icon"><lightning-icon icon-name="utility:video" size="x-small"></lightning-icon></span>
                        <span><strong>Tutorials</strong><small>Create and publish</small></span>
                    </button>
                    <button class={adminGroupsClass} data-section="groups" onclick={handleAdminSection}>
                        <span class="admin-nav-icon"><lightning-icon icon-name="utility:groups" size="x-small"></lightning-icon></span>
                        <span><strong>Groups</strong><small>Organize audiences</small></span>
                    </button>
                    <button class={adminSettingsClass} data-section="settings" onclick={handleAdminSection}>
                        <span class="admin-nav-icon"><lightning-icon icon-name="utility:settings" size="x-small"></lightning-icon></span>
                        <span><strong>Settings</strong><small>Platform defaults</small></span>
                    </button>
                </nav>
                <div class="admin-rail-tip"><lightning-icon icon-name="utility:info" size="xx-small"></lightning-icon><span>Switch to Library to browse tutorials as a learner.</span></div>
            </template>
            <template lwc:else>
                <div class="rail-title">Folders</div>
                <template for:each={folderItems} for:item="folder">
                    <div key={folder.id} class={folder.itemClass} style={folder.indentStyle} data-id={folder.id} onclick={handleFolderSelect}>
                        <lightning-icon icon-name="utility:open_folder" size="x-small" class="rail-ico"></lightning-icon>
                        <span class="rail-name">{folder.name}</span>
                        <span class="rail-count">{folder.count}</span>
                    </div>
                </template>
                <div class="rail-sep"></div>
                <div class="rail-progress">
                    <div class="rp-label"><span>Your progress</span><span class="tnum">{progressCountLabel}</span></div>
                    <div class="bar"><span style={progressStyle}></span></div>
                </div>
                <div class="rail-mode-toggle" role="group" aria-label="Workspace view">
                    <button class="active">Library</button>
                    <template lwc:if={isAdmin}><button onclick={showAdminMode}>Admin</button></template>
                </div>
            </template>
        </aside>

        <!-- ===== Main ===== -->
        <div class="main">
            <template lwc:if={showLibraryHeader}>
                <div class="topbar">
                    <div class="titles">
                        <div class="eyebrow">LogicLearn</div>
                        <h1 class="h1">{pageTitle}</h1>
                    </div>
                    <div class="topbar-spacer"></div>
                </div>
            </template>

            <div class="scroll">
                <template lwc:if={isAdminMode}>
                    <c-training-admin-console onlibrary={showLibraryMode}></c-training-admin-console>
                </template>

                <template lwc:else>
                    <div class="library-toolbar" role="search">
                        <div class="search">
                            <lightning-input
                                type="search"
                                variant="label-hidden"
                                placeholder="Search training videos"
                                value={searchTerm}
                                onchange={handleSearch}
                            ></lightning-input>
                        </div>
                        <lightning-button-icon
                            icon-name="utility:refresh"
                            alternative-text="Refresh"
                            title="Refresh"
                            onclick={handleRefresh}
                        ></lightning-button-icon>
                    </div>

                    <template lwc:if={error}>
                        <div class="empty error">
                            <lightning-icon icon-name="utility:error" variant="error"></lightning-icon>
                            <p>{error}</p>
                        </div>
                    </template>

                    <template lwc:elseif={hasResults}>
                        <template for:each={displaySections} for:item="section">
                        <section key={section.key} class="section">
                            <div class="sec-head">
                                <span class="sec-title">{section.folderName}</span>
                                <span class="sec-count">{section.countLabel}</span>
                                <span class="sec-done">{section.doneLabel}</span>
                            </div>
                            <template lwc:if={section.description}>
                                <p class="sec-desc">{section.description}</p>
                            </template>

                            <div class="grid">
                                <template for:each={section.videos} for:item="video">
                                    <article
                                        key={video.id}
                                        class={video.cardClass}
                                        data-id={video.id}
                                        data-title={video.title}
                                        onclick={handleCardClick}
                                        tabindex="0"
                                    >
                                        <div class="thumb" style={video.thumbStyle}>
                                            <template lwc:if={video.isMandatory}>
                                                <span class="mand-ribbon">
                                                    <lightning-icon icon-name="utility:warning" size="xx-small" variant="inverse"></lightning-icon>
                                                    Mandatory
                                                </span>
                                            </template>
                                            <div class="play">
                                                <lightning-icon icon-name="utility:play" size="small"></lightning-icon>
                                            </div>
                                            <template lwc:if={video.durationLabel}>
                                                <span class="dur tnum">{video.durationLabel}</span>
                                            </template>
                                            <template lwc:if={video.showProgressBar}>
                                                <div class="thumb-prog"><span style={video.progressBarStyle}></span></div>
                                            </template>
                                        </div>
                                        <div class="card-body">
                                            <div class="card-title">{video.title}</div>
                                            <template lwc:if={video.category}>
                                                <div class="card-meta">{video.category}</div>
                                            </template>
                                            <div class="card-foot">
                                                <span class={video.pillClass}>{video.pillLabel}</span>
                                                <template lwc:if={video.footNote}>
                                                    <span class="foot-note tnum">{video.footNote}</span>
                                                </template>
                                            </div>
                                        </div>
                                    </article>
                                </template>
                            </div>
                            </section>
                        </template>
                    </template>

                    <template lwc:else>
                        <div class="empty empty-library">
                            <div class="empty-art" aria-hidden="true">
                                <span class="empty-play"><lightning-icon icon-name="utility:play" size="small" variant="inverse"></lightning-icon></span>
                                <span class="empty-line one"></span>
                                <span class="empty-line two"></span>
                            </div>
                            <div class="empty-copy">
                                <h2>{emptyTitle}</h2>
                                <p>{emptyMessage}</p>
                            </div>
                            <template lwc:if={showAdminEmptyAction}>
                                <lightning-button variant="brand" icon-name="utility:add" label="Add your first tutorial" onclick={handleCreateFirstTutorial}></lightning-button>
                            </template>
                        </div>
                    </template>
                </template>
            </div>
        </div>
    </div>

    <!-- In-place video player modal -->
    <template lwc:if={showPlayer}>
        <section class="modal-backdrop" onclick={handleClosePlayer}>
            <div class="modal" onclick={stopPropagation}>
                <header class="modal-head">
                    <span class="modal-title">{activeTitle}</span>
                    <button class="modal-close" title="Close" onclick={handleClosePlayer}>
                        <lightning-icon icon-name="utility:close" size="x-small" variant="inverse"></lightning-icon>
                    </button>
                </header>
                <c-training-video-player video-id={activeVideoId} autoplay={activeAutoplay}></c-training-video-player>
            </div>
        </section>
    </template>
</template>
