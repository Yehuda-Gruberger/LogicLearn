<template>
    <div class={appClass}>
        <aside class="rail">
            <template lwc:if={isAdminMode}></template>
            <template lwc:else>
                <header class="learner-brand"><span><lightning-icon icon-name="utility:video" size="small" variant="inverse"></lightning-icon></span><div><small>Training</small><strong>LogicLearn</strong></div></header>
                <div class="rail-title">Folders</div>
                <template for:each={folderItems} for:item="folder"><div key={folder.id} class={folder.itemClass} style={folder.indentStyle} data-id={folder.id} onclick={handleFolderSelect}><span class="rail-ico" aria-hidden="true"></span><span class="rail-name">{folder.name}</span><span class="rail-count">{folder.count}</span></div></template>
                <div class="rail-progress"><div class="rp-label"><span>Your progress</span><span class="tnum">{progressCountLabel}</span></div><div class="bar"><span style={progressStyle}></span></div><small>{remainingProgressLabel}</small></div>
                <div class="rail-mode-toggle" role="group" aria-label="Workspace view"><button class="active">Library</button><template lwc:if={isAdmin}><button onclick={showAdminMode}>Admin</button></template></div>
            </template>
        </aside>

        <main class="main" onscroll={handleLibraryScroll}>
            <template lwc:if={isAdminMode}><div class="scroll admin-scroll"><c-training-admin-console onlibrary={showLibraryMode}></c-training-admin-console></div></template>
            <template lwc:else>
                <div class="library-shell">
                    <header class="library-head"><div><span>{selectedFolderName}</span><h1>Training Library</h1></div><div class="library-search"><lightning-input type="search" variant="label-hidden" label="Search videos and documents" placeholder="Search videos and documents" value={searchTerm} onchange={handleSearch}></lightning-input></div></header>
                    <div class="library-filterbar"><nav class="filter-chips" aria-label="Training status"><button class={allFilterClass} data-filter="all" onclick={handleLibraryFilter}>All <span>{allVideoCount}</span></button><button class={requiredFilterClass} data-filter="required" onclick={handleLibraryFilter}>Required <span>{requiredCount}</span></button><button class={progressFilterClass} data-filter="progress" onclick={handleLibraryFilter}>In progress <span>{inProgressCount}</span></button><button class={completedFilterClass} data-filter="completed" onclick={handleLibraryFilter}>Completed <span>{completedVideoCount}</span></button></nav><div class="type-filter" role="group" aria-label="Tutorial type"><button class={allTypesClass} data-type="all" onclick={handleContentFilter}>All types</button><button class={videosTypeClass} data-type="videos" onclick={handleContentFilter}>Videos</button><button class={documentsTypeClass} data-type="documents" onclick={handleContentFilter}>Documents</button></div></div>

                    <template lwc:if={error}><div class="empty error"><lightning-icon icon-name="utility:error" variant="error"></lightning-icon><p>{error}</p></div></template>
                    <template lwc:else>
                        <template lwc:if={hasRequiredVideos}>
                            <section class="required-section"><header><strong>Required for you</strong><span>{requiredFinishLabel}</span></header><div class="required-row"><template for:each={requiredVideoCards} for:item="video"><article key={video.id} class="required-card" data-id={video.id} data-title={video.title} onclick={handleCardClick} tabindex="0"><div class="required-thumb" style={video.thumbStyle}><template lwc:if={video.isDocument}><div class="document-paper mini"><i></i><i></i><i></i></div></template><template lwc:else><template lwc:if={video.previewUrl}><video src={video.previewUrl} muted loop playsinline preload="none" onmouseenter={handleThumbnailEnter} onmouseleave={handleThumbnailLeave}></video></template><span class="required-play"><lightning-icon icon-name={video.cardIcon} size="x-small" variant="inverse"></lightning-icon></span></template></div><div><strong>{video.title}</strong><small>{video.category} · {video.typeMeta}</small><template lwc:if={video.dateLabel}><span>{video.dateLabel}</span></template></div></article></template></div></section>
                        </template>

                        <section class="all-videos"><h2>All training</h2><template lwc:if={hasVisibleVideos}><div class="library-grid"><template for:each={visibleVideoCards} for:item="video"><article key={video.id} class={video.cardClass} data-id={video.id} data-title={video.title} onclick={handleCardClick} tabindex="0"><div class="thumb" style={video.thumbStyle}><template lwc:if={video.isDocument}><span class="doc-badge">DOC</span><div class="document-paper"><i></i><i></i><i></i><i></i></div></template><template lwc:else><span class="video-badge">VIDEO</span><template lwc:if={video.previewUrl}><video src={video.previewUrl} muted loop playsinline preload="none" onmouseenter={handleThumbnailEnter} onmouseleave={handleThumbnailLeave}></video></template><div class="play"><lightning-icon icon-name={video.cardIcon} size="small"></lightning-icon></div></template><template lwc:if={video.cornerLabel}><span class="dur tnum">{video.cornerLabel}</span></template><template lwc:if={video.showProgressBar}><div class="thumb-prog"><span style={video.progressBarStyle}></span></div></template></div><div class="card-body"><div class="card-title">{video.title}</div><div class="card-date">{video.dateLabel}</div><div class="card-foot"><span class="card-meta">{video.category}</span><span class={video.pillClass}>{video.pillLabel}</span></div></div></article></template></div></template><template lwc:else><div class="empty empty-library"><div class="empty-copy"><h2>{emptyTitle}</h2><p>{emptyMessage}</p></div><template lwc:if={showAdminEmptyAction}><button type="button" class="empty-action" onclick={handleCreateFirstTutorial}><lightning-icon icon-name="utility:add" size="xx-small" variant="inverse"></lightning-icon>Add your first tutorial</button></template></div></template></section>
                    </template>
                </div>
            </template>
        </main>
    </div>

    <template lwc:if={showPlayer}><section class="modal-backdrop" onclick={handleClosePlayer}><div class={modalClass} onclick={stopPropagation}><header class="modal-head"><span class="modal-title">{activeTitle}</span><button class="modal-close" title="Close" onclick={handleClosePlayer}><lightning-icon icon-name="utility:close" size="x-small" variant="inverse"></lightning-icon></button></header><template lwc:if={activeIsDocument}><c-logic-learn-document-reader video-id={activeVideoId} onprogresschange={handleDocumentProgress}></c-logic-learn-document-reader></template><template lwc:else><c-training-video-player video-id={activeVideoId} autoplay={activeAutoplay}></c-training-video-player></template></div></section></template>
</template>
