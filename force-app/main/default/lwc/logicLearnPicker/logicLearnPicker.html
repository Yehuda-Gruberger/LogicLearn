<template>
    <div class={pickerClass} onfocusout={handleFocusOut}>
        <template lwc:if={hideLabel}><span class="assistive-label">{label}</span></template>
        <template lwc:else><label class="label">{label}<template lwc:if={required}><span class="required"> *</span></template></label></template>
        <div class={inputClass} onclick={handleOpen}>
            <template lwc:if={hasSelected}>
                <div class="chips">
                    <template for:each={selectedItems} for:item="item">
                        <span class="chip" key={item.value}>
                            <template lwc:if={showMetaInChip}><small>{item.meta}</small></template>
                            {item.label}
                            <template lwc:if={editable}><button type="button" class="inline-edit" data-value={item.value} onclick={handleEdit} title="Edit template"><lightning-icon class="editable-icon" icon-name="utility:edit" size="xx-small"></lightning-icon></button></template>
                            <button type="button" data-value={item.value} onclick={handleRemove} title="Remove">×</button>
                        </span>
                    </template>
                </div>
            </template>
            <template lwc:if={hasExcluded}>
                <div class="chips">
                    <template for:each={excludedItems} for:item="item">
                        <span class="chip excluded" key={item.value}><small>Excluded</small>{item.label}<button type="button" data-kind="exclusion" data-value={item.value} onclick={handleRemove} title="Remove exclusion">×</button></span>
                    </template>
                </div>
            </template>
            <input type="search" placeholder={placeholder} value={query} onfocus={handleFocus} oninput={handleSearch} disabled={disabled}/>
            <lightning-icon icon-name="utility:chevrondown" size="xx-small"></lightning-icon>
        </div>
        <template lwc:if={open}>
            <div class="menu">
                <template for:each={filteredOptions} for:item="item">
                    <template lwc:if={actionMode}>
                        <div key={item.value} class={item.rowClass} data-value={item.value} onmousedown={handleOptionMouseDown} onclick={handleSelect}><span><strong>{item.label}</strong><template lwc:if={item.meta}><small>{item.meta}</small></template></span><template lwc:if={editable}><lightning-icon class="editable-icon option-editable" icon-name="utility:edit" size="xx-small" title="Editable"></lightning-icon></template><template lwc:if={item.canExclude}><span class="option-actions"><button type="button" class={item.excludeClass} data-value={item.value} onmousedown={handleOptionMouseDown} onclick={handleExclude} title="Exclude"><lightning-icon icon-name={item.excludeIcon} size="xx-small"></lightning-icon></button></span></template></div>
                    </template>
                    <template lwc:else>
                        <template lwc:if={editable}><div key={item.value} class={item.rowClass}><button type="button" class="option-choice" data-value={item.value} onclick={handleSelect}><template lwc:if={item.selected}><lightning-icon icon-name="utility:check" size="xx-small"></lightning-icon></template><span><strong>{item.label}</strong><template lwc:if={item.meta}><small>{item.meta}</small></template></span></button><button type="button" class="inline-option-edit" data-value={item.value} onmousedown={handleOptionMouseDown} onclick={handleEdit} title="Edit template"><lightning-icon class="editable-icon" icon-name="utility:edit" size="xx-small"></lightning-icon></button></div></template>
                        <template lwc:else><button type="button" key={item.value} class={item.rowClass} data-value={item.value} onclick={handleSelect}><template lwc:if={item.selected}><lightning-icon icon-name="utility:check" size="xx-small"></lightning-icon></template><span><strong>{item.label}</strong><template lwc:if={item.meta}><small>{item.meta}</small></template></span></button></template>
                    </template>
                </template>
                <template lwc:if={hasOptions}></template>
                <template lwc:else>
                    <div class="no-options">No matches</div>
                </template>
                <template lwc:if={showCreateOption}><button type="button" class="create-option" onclick={handleCreate}><lightning-icon icon-name="utility:add" size="xx-small"></lightning-icon><span>{createActionLabel}</span></button></template>
            </div>
        </template>
    </div>
</template>
