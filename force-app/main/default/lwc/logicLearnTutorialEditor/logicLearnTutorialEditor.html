<template>
    <div class="editor" onclick={stopPropagation}>
        <header class="editor-head">
            <div class="studio-title"><span class="studio-mark"><lightning-icon icon-name="utility:video" size="small" variant="inverse"></lightning-icon></span><div><div class="eyebrow">LogicLearn Studio</div><h2>{title}</h2></div></div>
            <div class="head-actions"><span class="status-badge"><span></span>{form.status}</span><lightning-button-icon icon-name="utility:close" alternative-text="Close" title="Close" variant="bare" onclick={handleCancel}></lightning-button-icon></div>
        </header>

        <template lwc:if={loading}><div class="loading"><lightning-spinner alternative-text="Preparing tutorial"></lightning-spinner></div></template>
        <template lwc:else>
            <div class="body">
                <div class="setup-grid">
                    <div class="editor-column">
                        <section class={videoCardClass}>
                            <header class="panel-head"><div class="panel-title"><h3>Video</h3><span class="help-icon" tabindex="0" aria-label="What learners will watch." data-help="What learners will watch."><lightning-icon icon-name="utility:info_alt" size="xx-small"></lightning-icon></span></div><div class="source-control"><lightning-combobox variant="label-hidden" data-field="contentType" label="Video source" value={form.contentType} options={contentOptions} onchange={handleField}></lightning-combobox></div></header>
                            <div class="panel-body video-body">
                                <template lwc:if={isFile}>
                                    <template lwc:if={hasFile}><div class="embedded-player"><c-training-video-player video-id={recordId} preview-only compact></c-training-video-player></div></template>
                                    <template lwc:else><div class="video-placeholder"><span class="play-ring"><lightning-icon icon-name="utility:play" size="small" variant="inverse"></lightning-icon></span><strong>Add your training video</strong><small>MP4 (H.264) gives learners the best playback experience</small></div></template>
                                    <div class="upload-tray"><div class="upload-copy"><span><lightning-icon icon-name="doctype:video" size="small"></lightning-icon></span><div><strong>{fileDisplayName}</strong><small>MP4 · Maximum 150 MB</small></div></div><lightning-file-upload label="Replace video" name="video" record-id={recordId} accept=".mp4,video/mp4" onuploadfinished={handleUpload} disabled={busy}></lightning-file-upload></div>
                                </template>
                                <template lwc:else><div class="external-setup"><lightning-icon icon-name="utility:new_window" size="medium"></lightning-icon><lightning-input data-field="externalUrl" type="url" label="External video URL" placeholder="https://example.com/video" value={form.externalUrl} onchange={handleField} required></lightning-input><p>External videos open in a new tab and cannot report watch progress.</p></div></template>
                            </div>
                        </section>

                        <section class={detailsCardClass}>
                            <header class="panel-head"><div class="panel-title"><h3>Details</h3><span class="help-icon" tabindex="0" aria-label="How the tutorial appears in the library." data-help="How the tutorial appears in the library."><lightning-icon icon-name="utility:info_alt" size="xx-small"></lightning-icon></span></div></header>
                            <div class="panel-body details-body"><lightning-input data-field="title" label="Title" value={form.title} oninput={handleTitleInput} onchange={handleField} required></lightning-input><lightning-textarea data-field="description" label="Description" placeholder="What will learners be able to do after watching?" value={form.description} onchange={handleField}></lightning-textarea><div class="details-grid"><c-logic-learn-picker data-field="folderId" label="Folder" placeholder="Search folders" create-label="Create folder" options={catalog.folders} value={form.folderId} onchange={handlePicker} oncreate={handleCreateFolder}></c-logic-learn-picker><c-logic-learn-picker data-field="category" label="Category" placeholder="Search categories" create-label="Create category" options={categoryOptions} value={form.category} onchange={handlePicker} oncreate={handleCreateCategory}></c-logic-learn-picker></div></div>
                        </section>
                    </div>

                    <div class="editor-column">
                        <section class={publishingCardClass}>
                            <header class="panel-head"><div class="panel-title"><h3>Publishing</h3><span class="help-icon" tabindex="0" aria-label="Status and playback rules." data-help="Status and playback rules."><lightning-icon icon-name="utility:info_alt" size="xx-small"></lightning-icon></span></div></header>
                            <div class="panel-body publishing-body"><label class="field-label">Status</label><div class="status-selector"><button class={draftStatusClass} data-value="Draft" onclick={handleStatusSelect}>Draft</button><button class={publishedStatusClass} data-value="Published" onclick={handleStatusSelect}>Published</button><button class={archivedStatusClass} data-value="Archived" onclick={handleStatusSelect}>Archived</button></div><div class="publishing-grid"><div><lightning-combobox label="Completion threshold" value={completionMode} options={completionModeOptions} onchange={handleCompletionMode}></lightning-combobox><template lwc:if={isCustomThreshold}><lightning-input data-field="completionThreshold" type="number" min="1" max="100" label="Custom threshold (%)" value={form.completionThreshold} onchange={handleField} required></lightning-input></template></div><lightning-combobox data-field="skipPrevention" label="Prevent skipping" value={form.skipPrevention} options={skipOptions} onchange={handleField}></lightning-combobox><lightning-input data-field="dueDate" type="date" label="Due date (optional)" value={form.dueDate} onchange={handleField}></lightning-input></div></div>
                        </section>

                        <section class={audienceCardClass}>
                            <header class="panel-head"><div class="panel-title"><h3>Audience</h3><span class="help-icon" tabindex="0" aria-label="Add users, profiles, or groups." data-help="Add users, profiles, or groups."><lightning-icon icon-name="utility:info_alt" size="xx-small"></lightning-icon></span></div></header>
                            <div class="audience-section"><div class="audience-label"><span class="audience-title"><strong>Who can view</strong><span class="help-icon" tabindex="0" aria-label="These users, profiles, and groups can find and open this tutorial. A user exclusion overrides every inclusion." data-help="These users, profiles, and groups can find and open this tutorial. A user exclusion overrides every inclusion."><lightning-icon icon-name="utility:info_alt" size="xx-small"></lightning-icon></span></span></div><c-logic-learn-picker class="audience-picker" multiple action-mode hide-label show-meta-in-chip data-purpose="visibility" label="Visibility audience" placeholder="Add users, profiles or groups" create-label="Create a new group" options={audienceOptions} value={visibilityAudience} exclusions={visibilityExcludedAudience} excludable-values={visibilityExcludableAudience} onchange={handleAudiencePicker} oncreate={handleCreateGroup}></c-logic-learn-picker><div class="channel-setting"><span>Notify when published</span><div class="channel-selector"><template for:each={publishChannelOptions} for:item="option"><button key={option.value} class={option.className} data-field="publishNotificationChannel" data-value={option.value} onclick={handleChannelSelect}>{option.label}</button></template></div></div></div>
                            <div class="audience-section"><div class="audience-label"><span class="audience-title"><strong>Required for</strong><span class="help-icon" tabindex="0" aria-label="These users, profiles, and groups must complete this tutorial. A user exclusion overrides every inclusion." data-help="These users, profiles, and groups must complete this tutorial. A user exclusion overrides every inclusion."><lightning-icon icon-name="utility:info_alt" size="xx-small"></lightning-icon></span></span><template lwc:if={hasVisibilityAudience}><button class="copy-audience" data-source="visibility" data-target="required" onclick={handleCopyAudience}><lightning-icon icon-name="utility:copy" size="xx-small"></lightning-icon>Copy from viewers</button></template></div><c-logic-learn-picker class="audience-picker" multiple action-mode hide-label show-meta-in-chip data-purpose="required" label="Required audience" placeholder="Add users, profiles or groups" create-label="Create a new group" options={audienceOptions} value={requiredAudience} exclusions={requiredExcludedAudience} excludable-values={requiredExcludableAudience} onchange={handleAudiencePicker} oncreate={handleCreateGroup}></c-logic-learn-picker><div class="channel-setting"><span>Notify required learners</span><div class="channel-selector"><template for:each={assignmentChannelOptions} for:item="option"><button key={option.value} class={option.className} data-field="assignmentNotificationChannel" data-value={option.value} onclick={handleChannelSelect}>{option.label}</button></template></div></div></div>
                        </section>
                    </div>
                </div>
            </div>

            <footer class="editor-foot"><div><lightning-button label="Cancel" onclick={handleCancel} disabled={saving}></lightning-button><lightning-button class="save" variant="brand" label={saveLabel} onclick={handleSave} disabled={saving}></lightning-button></div></footer>
        </template>

        <template lwc:if={showGroupCreator}><section class="quick-group-backdrop" onclick={closeGroupCreator}><div class="quick-group-modal" onclick={stopPropagation}><header><div><span class="card-kicker">Quick create</span><h3>New LogicLearn group</h3><p>Create it here and it will be selected automatically.</p></div><lightning-button-icon icon-name="utility:close" alternative-text="Close" title="Close" variant="bare" onclick={closeGroupCreator}></lightning-button-icon></header><div class="quick-group-body"><lightning-input data-field="name" label="Group name" value={groupForm.name} onchange={handleGroupField} required></lightning-input><lightning-textarea data-field="description" label="Description" value={groupForm.description} onchange={handleGroupField}></lightning-textarea><div class="quick-group-grid"><c-logic-learn-picker multiple data-field="users" label="Users" options={catalog.users} value={groupForm.users} onchange={handleGroupPicker}></c-logic-learn-picker><c-logic-learn-picker multiple data-field="profiles" label="Profiles" options={catalog.profiles} value={groupForm.profiles} onchange={handleGroupPicker}></c-logic-learn-picker></div><c-logic-learn-picker multiple data-field="groups" label="Nested groups (optional)" options={catalog.groups} value={groupForm.groups} onchange={handleGroupPicker}></c-logic-learn-picker></div><footer><lightning-button label="Cancel" onclick={closeGroupCreator}></lightning-button><lightning-button class="save" variant="brand" label="Create group" onclick={handleGroupSave} disabled={groupSaving}></lightning-button></footer></div></section></template>
    </div>
</template>
