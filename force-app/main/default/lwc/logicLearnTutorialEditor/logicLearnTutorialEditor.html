<template>
    <div class="editor" onclick={stopPropagation}>
        <header class="editor-head">
            <div class="studio-title">
                <span class="studio-mark"><lightning-icon icon-name="utility:video" size="small" variant="inverse"></lightning-icon></span>
                <div>
                    <div class="eyebrow">LogicLearn Studio</div>
                    <h2>{title}</h2>
                </div>
            </div>
            <div class="head-actions">
                <span class="status-badge"><span></span>{form.status}</span>
                <lightning-button-icon icon-name="utility:close" alternative-text="Close" title="Close" variant="bare" onclick={handleCancel}></lightning-button-icon>
            </div>
        </header>

        <template lwc:if={loading}>
            <div class="loading"><lightning-spinner alternative-text="Preparing tutorial"></lightning-spinner></div>
        </template>
        <template lwc:else>
            <nav class="stage-nav" aria-label="Tutorial sections">
                <button class={contentStageClass} data-target="content" onclick={handleStage}><span>1</span><div><strong>Content</strong><small>Video source</small></div></button>
                <i></i>
                <button class={detailsStageClass} data-target="details" onclick={handleStage}><span>2</span><div><strong>Details</strong><small>Title and folder</small></div></button>
                <i></i>
                <button class={settingsStageClass} data-target="settings" onclick={handleStage}><span>3</span><div><strong>Settings</strong><small>Completion rules</small></div></button>
                <i></i>
                <button class={audienceStageClass} data-target="audience" onclick={handleStage}><span>4</span><div><strong>Audience</strong><small>Access and notices</small></div></button>
            </nav>

            <div class="body">
                <div class="workspace">
                    <main class="content-column">
                        <section class="studio-card video-card" data-panel="content">
                            <div class="card-head">
                                <div><span class="card-kicker">Content</span><h3>Video</h3><p>Choose the experience learners will open.</p></div>
                                <div class="source-control"><lightning-combobox variant="label-hidden" data-field="contentType" label="Video source" value={form.contentType} options={contentOptions} onchange={handleField}></lightning-combobox></div>
                            </div>

                            <template lwc:if={isFile}>
                                <div class="video-canvas">
                                    <div class="video-art">
                                        <span class="play-ring"><lightning-icon icon-name="utility:play" size="medium" variant="inverse"></lightning-icon></span>
                                        <template lwc:if={hasFile}>
                                            <strong>{fileName}</strong>
                                            <small>Salesforce File - progress tracking enabled</small>
                                        </template>
                                        <template lwc:else>
                                            <strong>Add your training video</strong>
                                            <small>MP4 (H.264) gives learners the best playback experience</small>
                                        </template>
                                    </div>
                                </div>
                                <div class="upload-tray">
                                    <div class="upload-copy">
                                        <lightning-icon icon-name="utility:upload" size="small"></lightning-icon>
                                        <div><strong>{fileDisplayName}</strong><small>MP4 - Maximum 150 MB - Uploading a replacement updates this tutorial</small></div>
                                    </div>
                                    <lightning-file-upload label="Choose video" name="video" record-id={recordId} accept=".mp4,video/mp4" onuploadfinished={handleUpload} disabled={busy}></lightning-file-upload>
                                </div>
                            </template>
                            <template lwc:else>
                                <div class="external-canvas">
                                    <span class="external-icon"><lightning-icon icon-name="utility:new_window" size="large"></lightning-icon></span>
                                    <div><strong>Link to an external video</strong><p>YouTube, Vimeo, or any secure HTTPS video link.</p></div>
                                    <lightning-input data-field="externalUrl" type="url" variant="label-hidden" label="External video URL" placeholder="https://example.com/video" value={form.externalUrl} onchange={handleField} required></lightning-input>
                                </div>
                                <div class="notice"><lightning-icon icon-name="utility:info" size="x-small"></lightning-icon>External videos open in a new tab. Watch progress cannot be tracked, so learners mark them complete manually.</div>
                            </template>
                        </section>

                    </main>

                    <aside class="settings-column">
                        <template lwc:if={isContentStage}>
                            <section class="settings-card stage-guide">
                                <div class="settings-head"><span class="settings-icon"><lightning-icon icon-name="utility:video" size="x-small"></lightning-icon></span><div><h3>Content</h3><p>Start with the learner experience</p></div></div>
                                <div class="guide-step done"><span>1</span><div><strong>Choose a source</strong><small>Use a tracked Salesforce File or an external link.</small></div></div>
                                <div class="guide-step"><span>2</span><div><strong>Add the video</strong><small>Upload or paste the link in the preview workspace.</small></div></div>
                                <div class="guide-step"><span>3</span><div><strong>Continue to Details</strong><small>Name and organize the tutorial next.</small></div></div>
                            </section>
                        </template>

                        <template lwc:elseif={isDetailsStage}>
                            <section class="settings-card stage-panel" data-panel="details">
                                <div class="settings-head"><span class="settings-icon"><lightning-icon icon-name="utility:edit" size="x-small"></lightning-icon></span><div><h3>Tutorial details</h3><p>Give learners clear context</p></div></div>
                                <div class="settings-stack">
                                    <lightning-input data-field="title" label="Tutorial title" value={form.title} onchange={handleField} required></lightning-input>
                                    <lightning-textarea data-field="description" label="Description" value={form.description} onchange={handleField}></lightning-textarea>
                                    <c-logic-learn-picker data-field="folderId" label="Folder" placeholder="Search folders" options={catalog.folders} value={form.folderId} onchange={handlePicker}></c-logic-learn-picker>
                                    <lightning-combobox data-field="category" label="Category" value={form.category} options={categoryOptions} onchange={handleField}></lightning-combobox>
                                </div>
                            </section>
                        </template>

                        <template lwc:elseif={isSettingsStage}>
                            <section class="settings-card publish-card">
                                <div class="settings-head"><span class="settings-icon"><lightning-icon icon-name="utility:send" size="x-small"></lightning-icon></span><div><h3>Publishing</h3><p>Control tutorial availability</p></div></div>
                                <lightning-combobox data-field="status" label="Status" value={form.status} options={statusOptions} onchange={handleField}></lightning-combobox>
                                <div class="publish-note"><lightning-icon icon-name="utility:lock" size="xx-small"></lightning-icon>Publishing requires at least one visibility audience.</div>
                            </section>
                            <section class="settings-card" data-panel="settings">
                                <div class="settings-head"><span class="settings-icon"><lightning-icon icon-name="utility:settings" size="x-small"></lightning-icon></span><div><h3>Completion</h3><p>Progress and playback rules</p></div></div>
                                <div class="settings-stack">
                                    <lightning-combobox label="Completion threshold" value={completionMode} options={completionModeOptions} onchange={handleCompletionMode}></lightning-combobox>
                                    <template lwc:if={isCustomThreshold}><lightning-input data-field="completionThreshold" type="number" min="1" max="100" label="Custom threshold (%)" value={form.completionThreshold} onchange={handleField} required></lightning-input></template>
                                    <lightning-combobox data-field="skipPrevention" label="Prevent skipping" value={form.skipPrevention} options={skipOptions} onchange={handleField}></lightning-combobox>
                                    <lightning-input data-field="dueDate" type="date" label="Due date (optional)" value={form.dueDate} onchange={handleField}></lightning-input>
                                </div>
                            </section>
                        </template>

                        <template lwc:else>
                            <section class="settings-card audience-card" data-panel="audience">
                                <div class="settings-head"><span class="settings-icon"><lightning-icon icon-name="utility:groups" size="x-small"></lightning-icon></span><div><h3>Audience</h3><p>Choose who can see and complete it</p></div></div>
                                <div class="audience-block">
                                    <div class="audience-label"><strong>Visibility</strong><small>Who can find and open it</small></div>
                                    <c-logic-learn-picker multiple data-field="visibilityUsers" label="Users" options={catalog.users} value={form.visibilityUsers} onchange={handlePicker}></c-logic-learn-picker>
                                    <c-logic-learn-picker multiple data-field="visibilityProfiles" label="Profiles" options={catalog.profiles} value={form.visibilityProfiles} onchange={handlePicker}></c-logic-learn-picker>
                                    <c-logic-learn-picker multiple data-field="visibilityGroups" label="LogicLearn groups" create-label="Create a new group" options={catalog.groups} value={form.visibilityGroups} onchange={handlePicker} oncreate={handleCreateGroup}></c-logic-learn-picker>
                                </div>
                                <div class="audience-block">
                                    <div class="audience-label"><strong>Required</strong><small>Who must complete it</small></div>
                                    <c-logic-learn-picker multiple data-field="requiredUsers" label="Users" options={catalog.users} value={form.requiredUsers} onchange={handlePicker}></c-logic-learn-picker>
                                    <c-logic-learn-picker multiple data-field="requiredProfiles" label="Profiles" options={catalog.profiles} value={form.requiredProfiles} onchange={handlePicker}></c-logic-learn-picker>
                                    <c-logic-learn-picker multiple data-field="requiredGroups" label="LogicLearn groups" create-label="Create a new group" options={catalog.groups} value={form.requiredGroups} onchange={handlePicker} oncreate={handleCreateGroup}></c-logic-learn-picker>
                                </div>
                            </section>
                            <section class="settings-card notification-card">
                                <div class="settings-head"><span class="settings-icon"><lightning-icon icon-name="utility:notification" size="x-small"></lightning-icon></span><div><h3>Notifications</h3><p>Send only when you choose</p></div></div>
                                <div class="audience-block compact">
                                    <c-logic-learn-picker multiple data-field="notificationUsers" label="Users" options={catalog.users} value={form.notificationUsers} onchange={handlePicker}></c-logic-learn-picker>
                                    <c-logic-learn-picker multiple data-field="notificationProfiles" label="Profiles" options={catalog.profiles} value={form.notificationProfiles} onchange={handlePicker}></c-logic-learn-picker>
                                    <c-logic-learn-picker multiple data-field="notificationGroups" label="LogicLearn groups" create-label="Create a new group" options={catalog.groups} value={form.notificationGroups} onchange={handlePicker} oncreate={handleCreateGroup}></c-logic-learn-picker>
                                </div>
                                <div class="settings-stack channels">
                                    <lightning-combobox data-field="newVideoChannel" label="New-video notice" value={newVideoChannel} options={channelOptions} onchange={handleField}></lightning-combobox>
                                    <lightning-combobox data-field="assignmentChannel" label="Assignment notice" value={assignmentChannel} options={channelOptions} onchange={handleField}></lightning-combobox>
                                </div>
                                <p class="global-note">{emailTemplateHelp} Change global templates under Admin &gt; Settings.</p>
                            </section>
                        </template>
                    </aside>
                </div>
            </div>

            <footer class="editor-foot">
                <div class="save-summary"><lightning-icon icon-name="utility:check" size="xx-small"></lightning-icon><span>Content, settings, and audiences save together.</span></div>
                <div class="footer-actions"><lightning-button label="Cancel" onclick={handleCancel} disabled={saving}></lightning-button><lightning-button class="save" variant="brand" label={saveLabel} onclick={handleSave} disabled={saving}></lightning-button></div>
            </footer>
        </template>

        <template lwc:if={showGroupCreator}>
            <section class="quick-group-backdrop" onclick={closeGroupCreator}>
                <div class="quick-group-modal" onclick={stopPropagation}>
                    <header><div><span class="card-kicker">Quick create</span><h3>New LogicLearn group</h3><p>Create it here and it will be selected automatically.</p></div><lightning-button-icon icon-name="utility:close" alternative-text="Close" title="Close" variant="bare" onclick={closeGroupCreator}></lightning-button-icon></header>
                    <div class="quick-group-body">
                        <lightning-input data-field="name" label="Group name" value={groupForm.name} onchange={handleGroupField} required></lightning-input>
                        <lightning-textarea data-field="description" label="Description" value={groupForm.description} onchange={handleGroupField}></lightning-textarea>
                        <div class="quick-group-grid">
                            <c-logic-learn-picker multiple data-field="users" label="Users" options={catalog.users} value={groupForm.users} onchange={handleGroupPicker}></c-logic-learn-picker>
                            <c-logic-learn-picker multiple data-field="profiles" label="Profiles" options={catalog.profiles} value={groupForm.profiles} onchange={handleGroupPicker}></c-logic-learn-picker>
                        </div>
                        <c-logic-learn-picker multiple data-field="groups" label="Nested groups (optional)" options={catalog.groups} value={groupForm.groups} onchange={handleGroupPicker}></c-logic-learn-picker>
                    </div>
                    <footer><lightning-button label="Cancel" onclick={closeGroupCreator}></lightning-button><lightning-button class="save" variant="brand" label="Create group" onclick={handleGroupSave} disabled={groupSaving}></lightning-button></footer>
                </div>
            </section>
        </template>
    </div>
</template>
