<template>
    <div class="editor" onclick={stopPropagation}>
        <header class="editor-head">
            <div class="studio-title"><span class="studio-mark"><lightning-icon icon-name={studioIcon} size="small" variant="inverse"></lightning-icon></span><div><div class="eyebrow">LogicLearn Studio</div><h2>{title}</h2></div></div>
            <div class="head-actions"><span class="status-badge"><span></span>{form.status}</span><button type="button" class="icon-action bare" aria-label="Close" title="Close" onclick={handleCancel}><lightning-icon icon-name="utility:close" size="xx-small"></lightning-icon></button></div>
        </header>

        <template lwc:if={loading}><div class="loading"><lightning-spinner alternative-text="Preparing tutorial"></lightning-spinner></div></template>
        <template lwc:else>
            <div class="body">
                <div class={setupGridClass}>
                    <div class="editor-column">
                        <section class={videoCardClass}>
                            <header class="panel-head"><div class="panel-title"><h3>{contentPanelTitle}</h3><span class="help-icon" tabindex="0" aria-label={contentHelp} data-help={contentHelp}><lightning-icon icon-name="utility:info_alt" size="xx-small"></lightning-icon></span></div><template lwc:if={isVideoTutorial}><div class="source-control"><lightning-combobox variant="label-hidden" data-field="contentType" label="Video source" value={form.contentType} options={contentOptions} onchange={handleField}></lightning-combobox></div></template></header>
                            <div class="panel-body video-body">
                                <template lwc:if={isFile}>
                                    <template lwc:if={hasFile}><div class="embedded-player"><c-training-video-player video-id={recordId} preview-only compact></c-training-video-player></div></template>
                                    <template lwc:else><div class="video-placeholder"><lightning-icon icon-name="doctype:video" size="large" variant="inverse"></lightning-icon><strong>Video preview</strong><small>Your uploaded video will appear here</small></div></template>
                                    <div class={uploadTrayClass}><div class="upload-copy"><span><lightning-icon icon-name="doctype:video" size="small"></lightning-icon></span><div><strong>{fileDisplayName}</strong><small>MP4 or WebM · Maximum 150 MB</small></div></div><div class="upload-actions"><button type="button" class="record-screen" onclick={handleRecordScreen} disabled={busy}><span></span>Record screen</button><div class="upload-control"><lightning-file-upload class="native-uploader" label="" name="video" record-id={recordId} accept=".mp4,.webm,video/mp4,video/webm" onuploadfinished={handleUpload} disabled={busy}></lightning-file-upload></div></div></div>
                                </template>
                                <template lwc:elseif={isDocument}>
                                    <div class="document-builder">
                                        <nav class="page-rail" aria-label="Tutorial pages">
                                            <div class="page-rail-head"><div><strong>Pages</strong><small>Click a page to edit</small></div><button type="button" class="icon-action" onclick={addPage} aria-label="Add page" title="Add page"><lightning-icon icon-name="utility:add" size="xx-small"></lightning-icon></button></div>
                                            <div class="page-list"><template for:each={pageTabs} for:item="page"><button type="button" key={page.clientKey} class={page.className} data-index={page.index} onclick={handlePageSelect}><span>{page.pageNumber}</span><strong>{page.label}</strong></button></template></div>
                                            <button type="button" class="add-page-action" onclick={addPage}><lightning-icon icon-name="utility:add" size="xx-small"></lightning-icon>Add page</button>
                                        </nav>
                                        <div class="page-editor">
                                            <div class="document-sheet">
                                                <div class="page-tools"><lightning-input class="page-title-input" variant="label-hidden" label="Page title" placeholder="Page title" value={activePage.title} onchange={handlePageTitle}></lightning-input><div><button type="button" class="icon-action" data-direction="-1" onclick={movePage} disabled={cannotMovePageUp} aria-label="Move page up" title="Move up"><lightning-icon icon-name="utility:up" size="xx-small"></lightning-icon></button><button type="button" class="icon-action" data-direction="1" onclick={movePage} disabled={cannotMovePageDown} aria-label="Move page down" title="Move down"><lightning-icon icon-name="utility:down" size="xx-small"></lightning-icon></button><button type="button" class="icon-action danger" onclick={removePage} disabled={cannotRemovePage} aria-label="Remove page" title="Remove page"><lightning-icon icon-name="utility:delete" size="xx-small"></lightning-icon></button></div></div>
                                                <lightning-input-rich-text class="word-editor" label="Page content" variant="label-hidden" placeholder="Start writing this page..." value={activePage.body} formats={richTextFormats} share-with-entity-id={recordId} onchange={handlePageBody}></lightning-input-rich-text>
                                            </div>
                                        </div>
                                    </div>
                                </template>
                                <template lwc:else><div class="external-setup"><lightning-icon icon-name="utility:new_window" size="medium"></lightning-icon><lightning-input data-field="externalUrl" type="url" label="External video URL" placeholder="https://example.com/video" value={form.externalUrl} onchange={handleField} required></lightning-input><p>External videos open in a new tab and cannot report watch progress.</p></div></template>
                            </div>
                        </section>

                        <section class={detailsCardClass}>
                            <header class="panel-head"><div class="panel-title"><h3>Details</h3><span class="help-icon" tabindex="0" aria-label="How the tutorial appears in the library." data-help="How the tutorial appears in the library."><lightning-icon icon-name="utility:info_alt" size="xx-small"></lightning-icon></span></div></header>
                            <div class="panel-body details-body"><lightning-input data-field="title" label="Title" value={form.title} oninput={handleTitleInput} onchange={handleField} required></lightning-input><lightning-textarea data-field="description" label="Description" placeholder={descriptionPlaceholder} value={form.description} onchange={handleField}></lightning-textarea><div class="details-grid"><c-logic-learn-picker data-field="folderId" label="Folder" placeholder="Search folders" create-label="Create folder" options={catalog.folders} value={form.folderId} onchange={handlePicker} oncreate={handleCreateFolder}></c-logic-learn-picker><c-logic-learn-picker data-field="category" label="Category" placeholder="Search categories" create-label="Create category" options={categoryOptions} value={form.category} onchange={handlePicker} oncreate={handleCreateCategory}></c-logic-learn-picker></div></div>
                        </section>
                    </div>

                    <div class="editor-column">
                        <section class={publishingCardClass}>
                            <header class="panel-head"><div class="panel-title"><h3>Publishing</h3><span class="help-icon" tabindex="0" aria-label="Status and playback rules." data-help="Status and playback rules."><lightning-icon icon-name="utility:info_alt" size="xx-small"></lightning-icon></span></div></header>
                            <div class="panel-body publishing-body"><label class="field-label">Status</label><div class="status-selector"><button class={draftStatusClass} data-value="Draft" onclick={handleStatusSelect}>Draft</button><button class={publishedStatusClass} data-value="Published" onclick={handleStatusSelect}>Published</button><button class={archivedStatusClass} data-value="Archived" onclick={handleStatusSelect}>Archived</button></div><div class={publishingGridClass}><template lwc:if={showVideoRules}><div><lightning-combobox label="Completion threshold" value={completionMode} options={completionModeOptions} onchange={handleCompletionMode}></lightning-combobox><template lwc:if={isCustomThreshold}><lightning-input data-field="completionThreshold" type="number" min="1" max="100" label="Custom threshold (%)" value={form.completionThreshold} onchange={handleField} required></lightning-input></template></div><lightning-combobox data-field="skipPrevention" label="Prevent skipping" value={form.skipPrevention} options={skipOptions} onchange={handleField}></lightning-combobox></template><lightning-input data-field="dueDate" type="date" label="Due date (optional)" value={form.dueDate} onchange={handleField}></lightning-input></div><template lwc:if={isDocument}><div class="document-requirement"><div class="requirement-heading"><lightning-icon icon-name="utility:check" size="xx-small"></lightning-icon><strong>Reading requirements</strong></div><div class="requirement-controls"><lightning-combobox data-field="documentPageRequirement" label="Pages" value={form.documentPageRequirement} options={documentPageRequirementOptions} onchange={handleField}></lightning-combobox><lightning-combobox data-field="documentReadingOrder" label="Order" value={form.documentReadingOrder} options={documentReadingOrderOptions} onchange={handleField}></lightning-combobox><lightning-combobox data-field="documentCompletionMode" label="Completion" value={form.documentCompletionMode} options={documentCompletionModeOptions} onchange={handleField}></lightning-combobox></div></div></template></div>
                        </section>

                        <section class={audienceCardClass}>
                            <header class="panel-head"><div class="panel-title"><h3>Audience</h3><span class="help-icon" tabindex="0" aria-label="Add users, profiles, or groups." data-help="Add users, profiles, or groups."><lightning-icon icon-name="utility:info_alt" size="xx-small"></lightning-icon></span></div></header>
                            <div class="audience-section">
                                <div class="audience-label"><span class="audience-title"><strong>Who can view</strong><span class="help-icon" tabindex="0" aria-label="These users, profiles, and groups can find and open this tutorial. A user exclusion overrides every inclusion." data-help="These users, profiles, and groups can find and open this tutorial. A user exclusion overrides every inclusion."><lightning-icon icon-name="utility:info_alt" size="xx-small"></lightning-icon></span></span></div>
                                <c-logic-learn-picker class="audience-picker" multiple action-mode hide-label show-meta-in-chip data-purpose="visibility" label="Visibility audience" placeholder="Add users, profiles or groups" create-label="Create a new group" options={audienceOptions} value={visibilityAudience} exclusions={visibilityExcludedAudience} excludable-values={visibilityExcludableAudience} onchange={handleAudiencePicker} oncreate={handleCreateGroup}></c-logic-learn-picker>
                                <div class="channel-setting"><span>{publicationNoticeLabel}</span><div class="channel-selector"><template for:each={publishChannelOptions} for:item="option"><button key={option.value} class={option.className} data-field="publishNotificationChannel" data-value={option.value} onclick={handleChannelSelect}>{option.label}</button></template></div></div>
                                <template lwc:if={showLifecycleNotice}><div class={lifecycleNoticeClass}><header><div><strong>{lifecycleNoticeTitle}</strong><small>Global defaults are preselected</small></div><button type="button" onclick={toggleLifecycleCustomization}>{lifecycleCustomizationLabel}</button></header><template lwc:if={customizingLifecycleNotice}><div class="notice-fields"><template lwc:if={showLifecycleEmail}><c-logic-learn-picker label="Email template" placeholder="Choose a template" options={lifecycleTemplateOptions} value={lifecycleEmailTemplate} onchange={handleLifecycleTemplate}></c-logic-learn-picker></template><template lwc:if={showLifecycleInApp}><lightning-textarea label="In-app message" value={lifecycleInAppMessage} onchange={handleLifecycleMessage} required></lightning-textarea></template></div></template><template lwc:else><div class="notice-summary"><template lwc:if={showLifecycleEmail}><span><small>Email</small>{lifecycleEmailTemplate}</span></template><template lwc:if={showLifecycleInApp}><span><small>In-app</small>{lifecycleInAppMessage}</span></template></div></template></div></template>
                            </div>
                            <div class="audience-section"><div class="audience-label"><span class="audience-title"><strong>Required for</strong><span class="help-icon" tabindex="0" aria-label="These users, profiles, and groups must complete this tutorial. A user exclusion overrides every inclusion." data-help="These users, profiles, and groups must complete this tutorial. A user exclusion overrides every inclusion."><lightning-icon icon-name="utility:info_alt" size="xx-small"></lightning-icon></span></span><template lwc:if={hasVisibilityAudience}><button class="copy-audience" data-source="visibility" data-target="required" onclick={handleCopyAudience}><lightning-icon icon-name="utility:copy" size="xx-small"></lightning-icon>Copy from viewers</button></template></div><c-logic-learn-picker class="audience-picker" multiple action-mode hide-label show-meta-in-chip data-purpose="required" label="Required audience" placeholder="Add users, profiles or groups" create-label="Create a new group" options={audienceOptions} value={requiredAudience} exclusions={requiredExcludedAudience} excludable-values={requiredExcludableAudience} onchange={handleAudiencePicker} oncreate={handleCreateGroup}></c-logic-learn-picker><div class="channel-setting"><span>{requiredNoticeLabel}</span><div class="channel-selector"><template for:each={assignmentChannelOptions} for:item="option"><button key={option.value} class={option.className} data-field="assignmentNotificationChannel" data-value={option.value} onclick={handleChannelSelect}>{option.label}</button></template></div></div><template lwc:if={showRequiredNotice}><div class={requiredNoticeClass}><header><div><strong>{lifecycleNoticeTitle}</strong><small>Global defaults are preselected</small></div><button type="button" onclick={toggleRequiredCustomization}>{requiredCustomizationLabel}</button></header><template lwc:if={customizingRequiredNotice}><div class="notice-fields"><template lwc:if={showRequiredEmail}><c-logic-learn-picker label="Email template" placeholder="Choose a template" options={requiredTemplateOptions} value={requiredEmailTemplate} onchange={handleRequiredTemplate}></c-logic-learn-picker></template><template lwc:if={showRequiredInApp}><lightning-textarea label="In-app message" value={requiredInAppMessage} onchange={handleRequiredMessage} required></lightning-textarea></template></div></template><template lwc:else><div class="notice-summary"><template lwc:if={showRequiredEmail}><span><small>Email</small>{requiredEmailTemplate}</span></template><template lwc:if={showRequiredInApp}><span><small>In-app</small>{requiredInAppMessage}</span></template></div></template></div></template></div>
                        </section>
                    </div>
                </div>
            </div>

            <footer class="editor-foot"><div><button type="button" class="app-button secondary" onclick={handleCancel} disabled={saving}>Cancel</button><template lwc:if={showPublishActions}><button type="button" class="app-button secondary" data-notify="false" onclick={handleSave} disabled={saving}>{quietPublishLabel}</button><button type="button" class="app-button primary" data-notify="true" onclick={handleSave} disabled={saving}>Publish and notify</button></template><template lwc:else><button type="button" class="app-button primary" data-notify="false" onclick={handleSave} disabled={saving}>{saveLabel}</button></template></div></footer>
        </template>

        <template lwc:if={showGroupCreator}><section class="quick-group-backdrop" onclick={closeGroupCreator}><div class="quick-group-modal" onclick={stopPropagation}><header><div><span class="card-kicker">Quick create</span><h3>New LogicLearn group</h3><p>Create it here and it will be selected automatically.</p></div><button type="button" class="icon-action bare" aria-label="Close" title="Close" onclick={closeGroupCreator}><lightning-icon icon-name="utility:close" size="xx-small"></lightning-icon></button></header><div class="quick-group-body"><lightning-input data-field="name" label="Group name" value={groupForm.name} onchange={handleGroupField} required></lightning-input><lightning-textarea data-field="description" label="Description" value={groupForm.description} onchange={handleGroupField}></lightning-textarea><div class="quick-group-grid"><c-logic-learn-picker multiple data-field="users" label="Users" options={catalog.users} value={groupForm.users} onchange={handleGroupPicker}></c-logic-learn-picker><c-logic-learn-picker multiple data-field="profiles" label="Profiles" options={catalog.profiles} value={groupForm.profiles} onchange={handleGroupPicker}></c-logic-learn-picker></div><c-logic-learn-picker multiple data-field="groups" label="Nested groups (optional)" options={catalog.groups} value={groupForm.groups} onchange={handleGroupPicker}></c-logic-learn-picker></div><footer><button type="button" class="app-button secondary" onclick={closeGroupCreator}>Cancel</button><button type="button" class="app-button primary" onclick={handleGroupSave} disabled={groupSaving}>Create group</button></footer></div></section></template>
        <template lwc:if={showRecorder}><section class="recorder-backdrop" onclick={closeRecorder}><div class="recorder-modal" onclick={stopPropagation}><header><div><span class="card-kicker">Screen recorder</span><h3>Record your tutorial</h3></div><button type="button" class="icon-action bare" aria-label="Close recorder" title="Close" onclick={closeRecorder}><lightning-icon icon-name="utility:close" size="xx-small"></lightning-icon></button></header><div class="recorder-body"><template lwc:if={recording}><video class="recording-live" muted autoplay playsinline></video><div class="recording-status"><i></i><strong>Recording</strong><span>{recordingTime}</span></div></template><template lwc:elseif={recordingStopping}><div class="recording-processing"><lightning-spinner alternative-text="Preparing recording" size="small"></lightning-spinner><strong>Preparing your recording…</strong></div></template><template lwc:elseif={recordingReady}><video src={recordingPreviewUrl} controls playsinline></video><div class="recording-ready"><strong>Your recording is ready</strong><p>Download it, then close this window and select <b>Upload file</b> or <b>Replace</b> to attach the downloaded file.</p><button type="button" class="download-recording" onclick={downloadRecording}><lightning-icon icon-name="utility:download" size="xx-small"></lightning-icon>Download recording</button></div></template><template lwc:else><div class="recording-empty"><strong>No recording is available</strong><p>Close this window and select Record screen to try again.</p></div></template></div><footer><template lwc:if={recording}><button type="button" class="app-button danger" onclick={stopRecording}>Stop recording</button></template><template lwc:elseif={recordingReady}><button type="button" class="app-button secondary" onclick={recordAgain}>Record again</button><button type="button" class="app-button secondary" onclick={discardRecording}>Discard</button><button type="button" class="app-button primary" onclick={closeRecorder}>Close</button></template><template lwc:elseif={recordingStopping}><button type="button" class="app-button secondary" onclick={closeRecorder}>Close</button></template><template lwc:else><button type="button" class="app-button secondary" onclick={closeRecorder}>Close</button></template></footer></div></section></template>
    </div>
</template>
