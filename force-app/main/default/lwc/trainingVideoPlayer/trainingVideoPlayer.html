<template>
    <div class="player-card">
        <template lwc:if={isLoading}>
            <div class="state">
                <lightning-spinner alternative-text="Loading video" size="small"></lightning-spinner>
            </div>
        </template>

        <template lwc:if={error}>
            <div class="state error">
                <lightning-icon icon-name="utility:error" variant="error" size="small"></lightning-icon>
                <span>{error}</span>
            </div>
        </template>

        <template lwc:if={videoUrl}>
            <div class="video-wrap">
                <!-- controls gives native play/scrub/volume/fullscreen; the servlet honors
                     range requests so scrubbing streams without a full download. -->
                <video
                    class="video-el"
                    src={videoUrl}
                    controls
                    controlslist="nodownload"
                    preload="metadata"
                    onloadedmetadata={handleLoadedMetadata}
                    ontimeupdate={handleTimeUpdate}
                    onseeking={handleSeeking}
                    onended={handleEnded}
                    onpause={handlePause}
                    onplay={handlePlay}
                ></video>
            </div>

            <template lwc:if={showControlbar}><div class="controlbar">
                <span class="speed-label">Speed</span>
                <div class="speed-group" role="group" aria-label="Playback speed">
                    <template for:each={speedOptions} for:item="opt">
                        <button
                            key={opt.value}
                            class="speed-btn"
                            data-speed={opt.value}
                            data-active={opt.variant}
                            onclick={handleSpeedChange}
                        >{opt.label}</button>
                    </template>
                </div>
            </div>
        </template>

        <template lwc:if={isExternal}>
            <div class="external">
                <lightning-icon icon-name="utility:new_window" size="medium"></lightning-icon>
                <h3>External video</h3>
                <p>This video opens in a new tab. LogicLearn cannot track how much you watch.</p>
                <div class="external-actions">
                    <button type="button" class="player-button primary" onclick={handleOpenExternal}><lightning-icon icon-name="utility:new_window" size="xx-small" variant="inverse"></lightning-icon>Open video</button>
                    <button type="button" class="player-button secondary" onclick={handleManualComplete} disabled={completed}><lightning-icon icon-name="utility:check" size="xx-small"></lightning-icon>Mark complete</button>
                </div>
                <template lwc:if={completed}><span class="complete">Completed</span></template>
            </div></template>
        </template>
    </div>
</template>
