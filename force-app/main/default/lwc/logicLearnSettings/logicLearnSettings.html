<template>
    <div class="settings-content">
        <template lwc:if={loading}><div class="loading"><lightning-spinner alternative-text="Loading settings" size="small"></lightning-spinner></div></template>
        <template lwc:elseif={settings}>
            <section>
                <h3>Playback</h3>
                <div class="setting-row"><div><strong>Completion threshold</strong><p>How much of a video a learner must watch for it to count as completed.</p></div><div class="threshold-control"><input type="range" min="1" max="100" value={settings.completionThreshold} oninput={handleThreshold}/><lightning-input variant="label-hidden" data-field="completionThreshold" type="number" min="1" max="100" required label="Completion threshold" value={settings.completionThreshold} onchange={handleChange}></lightning-input></div></div>
                <div class="setting-row"><div><strong>Prevent skipping</strong><p>Assigned learners cannot skip ahead past portions they have not watched.</p></div><lightning-input variant="label-hidden" data-field="preventSkipping" type="toggle" label="Prevent skipping" checked={settings.preventSkipping} onchange={handleChange}></lightning-input></div>
            </section>
            <section>
                <h3>Reading defaults</h3>
                <p class="section-intro">Default completion rules for document tutorials. Editors can override each setting on an individual document.</p>
                <div class="reading-default-grid"><lightning-combobox data-field="documentPageRequirement" label="Pages required" value={settings.documentPageRequirement} options={documentPageRequirementOptions} onchange={handleChange}></lightning-combobox><lightning-combobox data-field="documentReadingOrder" label="Reading order" value={settings.documentReadingOrder} options={documentReadingOrderOptions} onchange={handleChange}></lightning-combobox><lightning-combobox data-field="documentCompletionMode" label="Completion" value={settings.documentCompletionMode} options={documentCompletionModeOptions} onchange={handleChange}></lightning-combobox></div>
            </section>
            <section>
                <h3>Publication notifications</h3>
                <p class="section-intro">Defaults are selected automatically when a tutorial is first published or an existing tutorial is updated. Editors can override them for a single notification.</p>
                <div class="lifecycle-grid">
                    <article><header><strong>First publish</strong><span>New tutorial</span></header><div class="template-control"><c-logic-learn-picker editable data-field="firstPublishEmailTemplate" label="Email template" placeholder="Choose a template" create-label="Create email template" options={firstPublishTemplateOptions} value={settings.firstPublishEmailTemplate} onchange={handleTemplateChange} oncreate={openTemplateCreator}></c-logic-learn-picker><div class="template-actions"><button type="button" data-field="firstPublishEmailTemplate" onclick={openNewTemplate}><lightning-icon icon-name="utility:add" size="xx-small"></lightning-icon>New</button><button type="button" data-field="firstPublishEmailTemplate" onclick={openEditTemplate}><lightning-icon icon-name="utility:edit" size="xx-small"></lightning-icon>Edit</button></div></div><lightning-textarea data-field="firstPublishInAppMessage" label="In-app message" value={settings.firstPublishInAppMessage} onchange={handleChange} required></lightning-textarea></article>
                    <article><header><strong>Tutorial updated</strong><span>Existing tutorial</span></header><div class="template-control"><c-logic-learn-picker editable data-field="updateEmailTemplate" label="Email template" placeholder="Choose a template" create-label="Create email template" options={updateTemplateOptions} value={settings.updateEmailTemplate} onchange={handleTemplateChange} oncreate={openTemplateCreator}></c-logic-learn-picker><div class="template-actions"><button type="button" data-field="updateEmailTemplate" onclick={openNewTemplate}><lightning-icon icon-name="utility:add" size="xx-small"></lightning-icon>New</button><button type="button" data-field="updateEmailTemplate" onclick={openEditTemplate}><lightning-icon icon-name="utility:edit" size="xx-small"></lightning-icon>Edit</button></div></div><lightning-textarea data-field="updateInAppMessage" label="In-app message" value={settings.updateInAppMessage} onchange={handleChange} required></lightning-textarea></article>
                </div>
                <p class="token-note">In-app messages support <code>[VIDEO_NAME]</code>.</p>
            </section>
            <section>
                <h3>Assignment and reminder emails</h3>
                <div class="template-grid">
                    <div><div class="template-control"><c-logic-learn-picker editable data-field="assignmentTemplateName" label="Assignment email" placeholder="Choose a template" create-label="Create email template" options={assignmentTemplateOptions} value={settings.assignmentTemplateName} onchange={handleTemplateChange} oncreate={openTemplateCreator}></c-logic-learn-picker><div class="template-actions"><button type="button" data-field="assignmentTemplateName" onclick={openNewTemplate}><lightning-icon icon-name="utility:add" size="xx-small"></lightning-icon>New</button><button type="button" data-field="assignmentTemplateName" onclick={openEditTemplate}><lightning-icon icon-name="utility:edit" size="xx-small"></lightning-icon>Edit</button></div></div><p>Sent when a learner is assigned a required tutorial.</p></div>
                    <div><div class="template-control"><c-logic-learn-picker editable data-field="reminderTemplateName" label="Reminder email" placeholder="Choose a template" create-label="Create email template" options={reminderTemplateOptions} value={settings.reminderTemplateName} onchange={handleTemplateChange} oncreate={openTemplateCreator}></c-logic-learn-picker><div class="template-actions"><button type="button" data-field="reminderTemplateName" onclick={openNewTemplate}><lightning-icon icon-name="utility:add" size="xx-small"></lightning-icon>New</button><button type="button" data-field="reminderTemplateName" onclick={openEditTemplate}><lightning-icon icon-name="utility:edit" size="xx-small"></lightning-icon>Edit</button></div></div><p>Used when an admin sends reminders to incomplete learners from Tracking.</p></div>
                </div>
            </section>
            <footer><span>{changeLabel}</span><div><button type="button" class="app-button secondary" onclick={handleCancel}>Cancel</button><button type="button" class="app-button primary" onclick={handleSave} disabled={saving}>Save settings</button></div></footer>
        </template>
    </div>
    <template lwc:if={showTemplateCreator}>
        <section class="template-backdrop" onclick={closeTemplateCreator}><div class="template-modal" onclick={stopPropagation}>
            <header><div><span>{templateModalKicker}</span><h3>{templateModalTitle}</h3><p>Create polished emails without leaving LogicLearn.</p></div><button type="button" class="icon-button" aria-label="Close" onclick={closeTemplateCreator}><lightning-icon icon-name="utility:close" size="xx-small"></lightning-icon></button></header>
            <div class="template-workspace">
                <div class="template-editor-pane"><div class="template-basics"><lightning-input data-field="name" label="Template name" value={templateForm.name} onchange={handleTemplateField} required></lightning-input><lightning-input data-field="subject" label="Email subject" value={templateForm.subject} onchange={handleTemplateField} required></lightning-input></div><div class="token-toolbar"><span>Insert merge field</span><div><button type="button" data-token="[USER_NAME]" onclick={handleInsertToken}>Learner name</button><button type="button" data-token="[VIDEO_NAME]" onclick={handleInsertToken}>Tutorial name</button><button type="button" data-token="[VIDEO_LINK]" onclick={handleInsertToken}>Tutorial link</button><button type="button" data-token="[LIBRARY_LINK]" onclick={handleInsertToken}>Library link</button></div></div><lightning-input-rich-text class="template-rich-text" label="Email message" variant="label-hidden" placeholder="Write the email message..." formats={templateFormats} value={templateForm.htmlBody} onchange={handleTemplateBody}></lightning-input-rich-text></div>
                <aside class="template-preview"><div class="preview-label"><span>Live preview</span><small>Sample learner data</small></div><div class="email-preview"><div class="preview-subject"><small>Subject</small><strong>{templatePreviewSubject}</strong></div><div class="preview-message"><lightning-formatted-rich-text value={templatePreviewBody}></lightning-formatted-rich-text></div></div></aside>
            </div>
            <footer><button type="button" class="app-button secondary" onclick={closeTemplateCreator}>Cancel</button><button type="button" class="app-button primary" onclick={handleSaveTemplate} disabled={creatingTemplate}>{templateSaveLabel}</button></footer>
        </div></section>
    </template>
</template>
