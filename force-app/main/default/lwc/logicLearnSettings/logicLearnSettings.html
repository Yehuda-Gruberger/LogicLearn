<template>
    <div class="settings-content">
        <template lwc:if={loading}><div class="loading"><lightning-spinner alternative-text="Loading settings" size="small"></lightning-spinner></div></template>
        <template lwc:elseif={settings}>
            <section><h3>Playback</h3><div class="setting-row"><div><strong>Completion threshold</strong><p>How much of a video a learner must watch for it to count as completed.</p></div><div class="threshold-control"><input type="range" min="1" max="100" value={settings.completionThreshold} oninput={handleThreshold}/><lightning-input variant="label-hidden" data-field="completionThreshold" type="number" min="1" max="100" required label="Completion threshold" value={settings.completionThreshold} onchange={handleChange}></lightning-input></div></div><div class="setting-row"><div><strong>Prevent skipping</strong><p>Assigned learners cannot skip ahead past portions they have not watched.</p></div><lightning-input variant="label-hidden" data-field="preventSkipping" type="toggle" label="Prevent skipping" checked={settings.preventSkipping} onchange={handleChange}></lightning-input></div></section>
            <section><h3>Publication notifications</h3><p class="section-intro">Defaults are selected automatically when a tutorial is first published or an existing published tutorial is updated. Editors can override them for a single notification.</p><div class="lifecycle-grid"><article><header><strong>First publish</strong><span>New tutorial</span></header><c-logic-learn-picker data-field="firstPublishEmailTemplate" label="Email template" placeholder="Choose a template" create-label="Create email template" options={firstPublishTemplateOptions} value={settings.firstPublishEmailTemplate} onchange={handleTemplateChange} oncreate={openTemplateCreator}></c-logic-learn-picker><lightning-textarea data-field="firstPublishInAppMessage" label="In-app message" value={settings.firstPublishInAppMessage} onchange={handleChange} required></lightning-textarea></article><article><header><strong>Tutorial updated</strong><span>Existing published tutorial</span></header><c-logic-learn-picker data-field="updateEmailTemplate" label="Email template" placeholder="Choose a template" create-label="Create email template" options={updateTemplateOptions} value={settings.updateEmailTemplate} onchange={handleTemplateChange} oncreate={openTemplateCreator}></c-logic-learn-picker><lightning-textarea data-field="updateInAppMessage" label="In-app message" value={settings.updateInAppMessage} onchange={handleChange} required></lightning-textarea></article></div><p class="token-note">In-app messages support the token <code>[VIDEO_NAME]</code>.</p></section>
            <section><h3>Email templates</h3><div class="template-grid"><div><c-logic-learn-picker data-field="assignmentTemplateName" label="Assignment email" placeholder="Choose a template" create-label="Create email template" options={assignmentTemplateOptions} value={settings.assignmentTemplateName} onchange={handleTemplateChange} oncreate={openTemplateCreator}></c-logic-learn-picker><p>Sent when a tutorial is assigned or a new video is added.</p></div><div><c-logic-learn-picker data-field="reminderTemplateName" label="Reminder email" placeholder="Choose a template" create-label="Create email template" options={reminderTemplateOptions} value={settings.reminderTemplateName} onchange={handleTemplateChange} oncreate={openTemplateCreator}></c-logic-learn-picker><p>Sent to learners with unfinished required tutorials.</p></div></div></section>
            <footer><span>{changeLabel}</span><div><button type="button" class="app-button secondary" onclick={handleCancel}>Cancel</button><button type="button" class="app-button primary" onclick={handleSave} disabled={saving}>Save settings</button></div></footer>
        </template>
    </div>

    <template lwc:if={showTemplateCreator}><section class="template-backdrop" onclick={closeTemplateCreator}><div class="template-modal" onclick={stopPropagation}><header><div><span>Create template</span><h3>New LogicLearn email template</h3></div><button type="button" class="icon-button" aria-label="Close" onclick={closeTemplateCreator}><lightning-icon icon-name="utility:close" size="xx-small"></lightning-icon></button></header><div class="template-body"><lightning-input data-field="name" label="Template name" value={templateForm.name} onchange={handleTemplateField} required></lightning-input><lightning-input data-field="subject" label="Subject" value={templateForm.subject} onchange={handleTemplateField} required></lightning-input><lightning-textarea data-field="htmlBody" label="Message" value={templateForm.htmlBody} onchange={handleTemplateField} required></lightning-textarea><p>Available tokens: [USER_NAME], [VIDEO_NAME], [VIDEO_LINK], [LIBRARY_LINK]</p></div><footer><button type="button" class="app-button secondary" onclick={closeTemplateCreator}>Cancel</button><button type="button" class="app-button primary" onclick={handleCreateTemplate} disabled={creatingTemplate}>Create template</button></footer></div></section></template>
</template>
