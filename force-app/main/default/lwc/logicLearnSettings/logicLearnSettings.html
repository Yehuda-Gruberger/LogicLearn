<template>
    <div class="settings-content">
        <template lwc:if={loading}><div class="loading"><lightning-spinner alternative-text="Loading settings" size="small"></lightning-spinner></div></template>
        <template lwc:elseif={settings}>
            <section><h3>Playback</h3><div class="setting-row"><div><strong>Completion threshold</strong><p>How much of a video a learner must watch for it to count as completed.</p></div><div class="threshold-control"><input type="range" min="1" max="100" value={settings.completionThreshold} oninput={handleThreshold}/><lightning-input variant="label-hidden" data-field="completionThreshold" type="number" min="1" max="100" required label="Completion threshold" value={settings.completionThreshold} onchange={handleChange}></lightning-input></div></div><div class="setting-row"><div><strong>Prevent skipping</strong><p>Assigned learners cannot skip ahead past portions they have not watched.</p></div><lightning-input variant="label-hidden" data-field="preventSkipping" type="toggle" label="Prevent skipping" checked={settings.preventSkipping} onchange={handleChange}></lightning-input></div></section>
            <section><h3>Email templates</h3><div class="template-grid"><div><c-logic-learn-picker data-field="assignmentTemplateName" label="Assignment email" placeholder="Choose a template" create-label="Create email template" options={assignmentTemplateOptions} value={settings.assignmentTemplateName} onchange={handleTemplateChange} oncreate={openTemplateCreator}></c-logic-learn-picker><p>Sent when a tutorial is assigned or a new video is added.</p></div><div><c-logic-learn-picker data-field="reminderTemplateName" label="Reminder email" placeholder="Choose a template" create-label="Create email template" options={reminderTemplateOptions} value={settings.reminderTemplateName} onchange={handleTemplateChange} oncreate={openTemplateCreator}></c-logic-learn-picker><p>Sent to learners with unfinished required tutorials.</p></div></div></section>
            <footer><span>{changeLabel}</span><div><lightning-button label="Cancel" onclick={handleCancel}></lightning-button><lightning-button class="save" variant="brand" label="Save settings" onclick={handleSave} disabled={saving}></lightning-button></div></footer>
        </template>
    </div>

    <template lwc:if={showTemplateCreator}><section class="template-backdrop" onclick={closeTemplateCreator}><div class="template-modal" onclick={stopPropagation}><header><div><span>Create template</span><h3>New LogicLearn email template</h3></div><lightning-button-icon icon-name="utility:close" alternative-text="Close" variant="bare" onclick={closeTemplateCreator}></lightning-button-icon></header><div class="template-body"><lightning-input data-field="name" label="Template name" value={templateForm.name} onchange={handleTemplateField} required></lightning-input><lightning-input data-field="subject" label="Subject" value={templateForm.subject} onchange={handleTemplateField} required></lightning-input><lightning-textarea data-field="htmlBody" label="Message" value={templateForm.htmlBody} onchange={handleTemplateField} required></lightning-textarea><p>Available tokens: [USER_NAME], [VIDEO_NAME], [VIDEO_LINK], [LIBRARY_LINK]</p></div><footer><lightning-button label="Cancel" onclick={closeTemplateCreator}></lightning-button><lightning-button class="save" variant="brand" label="Create template" onclick={handleCreateTemplate} disabled={creatingTemplate}></lightning-button></footer></div></section></template>
</template>
