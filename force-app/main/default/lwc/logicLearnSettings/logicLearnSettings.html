<template>
    <div class="settings-content">
        <template lwc:if={loading}><div class="loading"><lightning-spinner alternative-text="Loading settings" size="small"></lightning-spinner></div></template>
        <template lwc:elseif={settings}>
            <section class="settings-section video-defaults">
                <div class="section-heading"><span class="section-icon video"><lightning-icon icon-name="utility:video" size="x-small"></lightning-icon></span><div><h3>Video tutorial defaults</h3><p>Default viewing rules for video tutorials. Editors can override them for an individual video.</p></div></div>
                <div class="setting-row"><div><strong>Watch requirement</strong><p>Percentage of a video a learner must watch before it is marked complete.</p></div><div class="threshold-control"><input type="range" min="1" max="100" aria-label="Default watch requirement" value={settings.completionThreshold} oninput={handleThreshold}/><lightning-input variant="label-hidden" data-field="completionThreshold" type="number" min="1" max="100" required label="Default watch requirement" value={settings.completionThreshold} onchange={handleChange}></lightning-input><span>%</span></div></div>
                <div class="setting-row"><div><strong>Prevent skipping</strong><p>Required learners cannot jump ahead to portions they have not watched.</p></div><lightning-input variant="label-hidden" data-field="preventSkipping" type="toggle" label="Prevent skipping" message-toggle-active="On" message-toggle-inactive="Off" checked={settings.preventSkipping} onchange={handleChange}></lightning-input></div>
            </section>
            <section class="settings-section document-defaults">
                <div class="section-heading"><span class="section-icon document"><lightning-icon icon-name="utility:knowledge_base" size="x-small"></lightning-icon></span><div><h3>Document tutorial defaults</h3><p>Default reading rules for document tutorials. Editors can override them for an individual document.</p></div></div>
                <div class="reading-default-grid"><lightning-combobox data-field="documentPageRequirement" label="Required pages" value={settings.documentPageRequirement} options={documentPageRequirementOptions} onchange={handleChange}></lightning-combobox><lightning-combobox data-field="documentReadingOrder" label="Page order" value={settings.documentReadingOrder} options={documentReadingOrderOptions} onchange={handleChange}></lightning-combobox><lightning-combobox data-field="documentCompletionMode" label="Completion behavior" value={settings.documentCompletionMode} options={documentCompletionModeOptions} onchange={handleChange}></lightning-combobox></div>
            </section>
            <section class="settings-section notification-defaults">
                <div class="section-heading"><span class="section-icon notification"><lightning-icon icon-name="utility:notification" size="x-small"></lightning-icon></span><div><h3>Notification defaults</h3><p>Default messages for tutorial viewers and required learners. Editors can customize publication notifications before sending.</p></div></div>
                <div class="notification-subheading"><strong>Viewer announcements</strong><p>Sent to the <b>Who can view</b> audience when a tutorial is first published or updated.</p></div>
                <div class="lifecycle-grid">
                    <article><header><strong>First published</strong><span>New tutorial</span></header><div class="template-control"><c-logic-learn-picker editable data-field="firstPublishEmailTemplate" label="Email template" placeholder="Choose a template" create-label="Create email template" options={firstPublishTemplateOptions} value={settings.firstPublishEmailTemplate} onchange={handleTemplateChange} oncreate={openTemplateCreator} onedit={openEditTemplate}></c-logic-learn-picker><div class="template-actions"><button type="button" data-field="firstPublishEmailTemplate" onclick={openNewTemplate}><lightning-icon icon-name="utility:add" size="xx-small"></lightning-icon>New</button></div></div><lightning-textarea data-field="firstPublishInAppMessage" label="In-app message" value={settings.firstPublishInAppMessage} onchange={handleChange} required></lightning-textarea></article>
                    <article><header><strong>Tutorial updated</strong><span>Existing tutorial</span></header><div class="template-control"><c-logic-learn-picker editable data-field="updateEmailTemplate" label="Email template" placeholder="Choose a template" create-label="Create email template" options={updateTemplateOptions} value={settings.updateEmailTemplate} onchange={handleTemplateChange} oncreate={openTemplateCreator} onedit={openEditTemplate}></c-logic-learn-picker><div class="template-actions"><button type="button" data-field="updateEmailTemplate" onclick={openNewTemplate}><lightning-icon icon-name="utility:add" size="xx-small"></lightning-icon>New</button></div></div><lightning-textarea data-field="updateInAppMessage" label="In-app message" value={settings.updateInAppMessage} onchange={handleChange} required></lightning-textarea></article>
                </div>
                <p class="token-note">In-app messages support <code>[VIDEO_NAME]</code>.</p>
                <div class="notification-divider"></div>
                <div class="notification-subheading"><strong>Required learner announcements</strong><p>Sent to the <b>Required for</b> audience when a tutorial is first published or updated.</p></div>
                <div class="lifecycle-grid">
                    <article><header><strong>First published</strong><span>New required tutorial</span></header><div class="template-control"><c-logic-learn-picker editable data-field="assignmentTemplateName" label="Email template" placeholder="Choose a template" create-label="Create email template" options={assignmentTemplateOptions} value={settings.assignmentTemplateName} onchange={handleTemplateChange} oncreate={openTemplateCreator} onedit={openEditTemplate}></c-logic-learn-picker><div class="template-actions"><button type="button" data-field="assignmentTemplateName" onclick={openNewTemplate}><lightning-icon icon-name="utility:add" size="xx-small"></lightning-icon>New</button></div></div><lightning-textarea data-field="assignmentInAppMessage" label="In-app message" value={settings.assignmentInAppMessage} onchange={handleChange} required></lightning-textarea></article>
                    <article><header><strong>Tutorial updated</strong><span>Existing required tutorial</span></header><div class="template-control"><c-logic-learn-picker editable data-field="requiredUpdateEmailTemplate" label="Email template" placeholder="Choose a template" create-label="Create email template" options={requiredUpdateTemplateOptions} value={settings.requiredUpdateEmailTemplate} onchange={handleTemplateChange} oncreate={openTemplateCreator} onedit={openEditTemplate}></c-logic-learn-picker><div class="template-actions"><button type="button" data-field="requiredUpdateEmailTemplate" onclick={openNewTemplate}><lightning-icon icon-name="utility:add" size="xx-small"></lightning-icon>New</button></div></div><lightning-textarea data-field="requiredUpdateInAppMessage" label="In-app message" value={settings.requiredUpdateInAppMessage} onchange={handleChange} required></lightning-textarea></article>
                </div>
                <p class="token-note">In-app messages support <code>[VIDEO_NAME]</code>. Due dates are added to first-publish assignments automatically.</p>
            </section>
            <footer><span>{changeLabel}</span><div><button type="button" class="app-button secondary" onclick={handleCancel}>Cancel</button><button type="button" class="app-button primary" onclick={handleSave} disabled={saving}>Save settings</button></div></footer>
        </template>
    </div>
    <template lwc:if={showTemplateCreator}>
        <section class="template-backdrop" onclick={stopPropagation}><div class="template-modal">
            <header><div><span>{templateModalKicker}</span><h3>{templateModalTitle}</h3><p>Create and edit reusable email templates.</p></div><button type="button" class="icon-button" aria-label="Close" onclick={closeTemplateCreator}><lightning-icon icon-name="utility:close" size="xx-small"></lightning-icon></button></header>
            <div class="template-workspace">
                <div class="template-editor-pane"><div class="template-basics"><lightning-input data-field="name" label="Template name" value={templateForm.name} onchange={handleTemplateField} required></lightning-input><lightning-input data-field="subject" label="Email subject" value={templateForm.subject} onchange={handleTemplateField} required></lightning-input></div><div class="token-toolbar"><span>Insert merge field</span><div><button type="button" data-token="[USER_NAME]" onclick={handleInsertToken}>Learner name</button><button type="button" data-token="[VIDEO_NAME]" onclick={handleInsertToken}>Tutorial name</button><button type="button" data-token="[VIDEO_LINK]" onclick={handleInsertToken}>Tutorial link</button><button type="button" data-token="[LIBRARY_LINK]" onclick={handleInsertToken}>Library link</button></div></div><lightning-input-rich-text class="template-rich-text" label="Email message" variant="label-hidden" placeholder="Write the email message..." formats={templateFormats} value={templateForm.htmlBody} onchange={handleTemplateBody}></lightning-input-rich-text></div>
                <aside class="template-preview"><div class="preview-label"><span>Live preview</span><small>Sample learner data</small></div><div class="email-preview"><div class="preview-subject"><small>Subject</small><strong>{templatePreviewSubject}</strong></div><div class="preview-message"><lightning-formatted-rich-text value={templatePreviewBody}></lightning-formatted-rich-text></div></div></aside>
            </div>
            <footer><button type="button" class="app-button secondary" onclick={closeTemplateCreator}>Cancel</button><button type="button" class="app-button primary" onclick={handleSaveTemplate} disabled={creatingTemplate}>{templateSaveLabel}</button></footer>
        </div></section>
    </template>
</template>
