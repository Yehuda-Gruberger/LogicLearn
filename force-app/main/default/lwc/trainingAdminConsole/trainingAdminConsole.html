<template>
    <template lwc:if={isTutorials}>
        <div class="master-detail">
            <aside class="video-browser">
                <header class="browser-brand"><span><lightning-icon icon-name="utility:video" size="small" variant="inverse"></lightning-icon></span><div><small>Training workspace</small><strong>LogicLearn</strong></div><button class="brand-settings" title="Global settings" onclick={openSettings}><lightning-icon icon-name="utility:settings" size="x-small" variant="inverse"></lightning-icon></button></header>
                <button class="create-top" onclick={handleNewVideo}><lightning-icon icon-name="utility:add" size="xx-small" variant="inverse"></lightning-icon><span>Create tutorial</span></button>
                <lightning-input class="video-search" type="search" variant="label-hidden" label="Search tutorials" placeholder="Search tutorials" value={videoSearch} onchange={handleVideoSearch}></lightning-input>
                <div class="browser-filters">
                    <c-logic-learn-picker multiple label="Folder" placeholder="All folders" options={browserFolderOptions} value={folderFilter} onchange={handleFolderFilter}></c-logic-learn-picker>
                    <c-logic-learn-picker multiple label="Category" placeholder="All categories" options={browserCategoryOptions} value={categoryFilter} onchange={handleCategoryFilter}></c-logic-learn-picker>
                    <c-logic-learn-picker multiple class="status-filter" label="Status" placeholder="All statuses" options={browserStatusOptions} value={statusFilter} onchange={handleStatusFilter}></c-logic-learn-picker>
                </div>
                <div class="browser-list">
                    <template lwc:if={hasFilteredVideos}>
                        <template for:each={filteredTutorialRows} for:item="video">
                            <button key={video.id} class={video.rowClass} data-id={video.id} onclick={handleVideoSelect}>
                                <span class="browser-thumb" style={video.thumbStyle}>
                                    <template lwc:if={video.previewUrl}><video src={video.previewUrl} muted loop playsinline preload="metadata" onmouseenter={handleThumbnailEnter} onmouseleave={handleThumbnailLeave}></video></template>
                                    <span class="thumb-play"><lightning-icon icon-name="utility:play" size="xx-small" variant="inverse"></lightning-icon></span>
                                </span>
                                <span class="browser-copy"><strong>{video.title}</strong><small>{video.meta}</small><small class="created-date">Created {video.createdLabel}</small><span class={video.statusClass}>{video.status}</span></span>
                            </button>
                        </template>
                    </template>
                    <template lwc:else><div class="browser-empty">No tutorials match these filters.</div></template>
                </div>
                <div class="browser-mode-toggle" role="group" aria-label="Workspace view"><button onclick={handleLibraryMode}>Library</button><button class="active">Admin</button></div>
            </aside>

            <main class="video-dashboard">
                <template lwc:if={detailLoading}><div class="dashboard-loading"><lightning-spinner alternative-text="Loading tutorial dashboard"></lightning-spinner></div></template>
                <template lwc:elseif={selectedTutorial}>
                    <section class="video-stage">
                        <div class="video-hero">
                            <c-training-video-player video-id={selectedVideoId} preview-only onplay={handlePreviewPlay} onpause={handlePreviewPause}></c-training-video-player>
                            <div class="hero-toolbar">
                                <span>{selectedTutorial.folderName} / {selectedTutorial.category} / {selectedTutorial.title}</span>
                                <div class="dashboard-actions"><lightning-button-icon icon-name="utility:delete" alternative-text="Delete tutorial" title="Delete tutorial" variant="bare-inverse" onclick={handleDeleteSelected}></lightning-button-icon><lightning-button-icon icon-name="utility:edit" alternative-text="Edit tutorial" title="Edit tutorial" variant="bare-inverse" onclick={handleEditSelected}></lightning-button-icon></div>
                            </div>
                            <template lwc:if={heroOverlayVisible}>
                                <div class="hero-info">
                                    <div class="hero-copy">
                                        <span class="hero-kicker">Training tutorial</span>
                                        <h2>{selectedTutorial.title}</h2>
                                        <div class="hero-meta"><span>{selectedTutorial.category}</span><span>Created {selectedRow.createdLabel}</span><span class={selectedRow.statusClass}>{selectedTutorial.status}</span></div>
                                        <p>{selectedTutorial.description}</p>
                                        <small>{selectedTutorial.contentType}</small>
                                    </div>
                                    <button class="hero-play-button" onclick={handleHeroPlay}><span><lightning-icon icon-name="utility:play" size="small" variant="inverse"></lightning-icon></span><strong>Play tutorial</strong></button>
                                </div>
                            </template>
                        </div>
                    </section>

                    <section class="activity-stats">
                        <article><span class="stat-icon teal"><lightning-icon icon-name="utility:preview" size="small"></lightning-icon></span><div><strong>{activitySummary.totalOpens}</strong><small>Total opens</small></div></article>
                        <article><span class="stat-icon blue"><lightning-icon icon-name="utility:play" size="small"></lightning-icon></span><div><strong>{activitySummary.started}</strong><small>Started</small></div></article>
                        <article><span class="stat-icon green"><lightning-icon icon-name="utility:check" size="small"></lightning-icon></span><div><strong>{activitySummary.completed}</strong><small>Completed</small></div></article>
                        <article><span class="stat-icon purple"><lightning-icon icon-name="utility:chart" size="small"></lightning-icon></span><div><strong>{activitySummary.averageWatch}%</strong><small>Average watched</small></div></article>
                    </section>

                    <section class="audience-strip">
                        <div><small>Can view</small><strong>{selectedTutorial.visibilitySummary}</strong></div>
                        <div><small>Required</small><strong>{selectedTutorial.requiredSummary}</strong></div>
                        <div><small>Notifications</small><strong>{selectedTutorial.notificationSummary}</strong></div>
                    </section>

                    <section class="tutorial-info">
                        <div class="info-top"><span class={selectedRow.statusClass}>{selectedTutorial.status}</span><small>{selectedTutorial.contentType}</small></div>
                        <p>{selectedTutorial.description}</p>
                        <dl>
                            <div><dt>Completion</dt><dd>{selectedTutorial.completionLabel}</dd></div>
                            <div><dt>Skipping</dt><dd>{selectedTutorial.skipLabel}</dd></div>
                            <div><dt>Due date</dt><dd>{selectedTutorial.dueDate}</dd></div>
                            <div><dt>Required audience</dt><dd>{selectedTutorial.requiredSummary}</dd></div>
                        </dl>
                    </section>
                </template>
                <template lwc:else>
                    <div class="dashboard-empty"><span><lightning-icon icon-name="utility:video" size="large" variant="inverse"></lightning-icon></span><h2>Create your first tutorial</h2><p>Add a video, choose its audience, and track engagement from this workspace.</p><lightning-button variant="brand" label="Create tutorial" icon-name="utility:add" onclick={handleNewVideo}></lightning-button></div>
                </template>
            </main>
            <aside class="people-sidebar">
                <template lwc:if={selectedTutorial}><c-logic-learn-tracking people compact video-id={selectedVideoId} ontrackingloaded={handleTrackingLoaded}></c-logic-learn-tracking></template>
                <template lwc:else><div class="people-placeholder"><lightning-icon icon-name="utility:people" size="medium"></lightning-icon><span>Select a tutorial to see its learners.</span></div></template>
            </aside>
        </div>
    </template>
    <template lwc:elseif={isGroups}><c-logic-learn-group-manager></c-logic-learn-group-manager></template>
    <template lwc:else><div class="settings-page"><header><button onclick={openTutorials}><lightning-icon icon-name="utility:back" size="xx-small"></lightning-icon><span>Back to tutorials</span></button><div><span class="eyebrow">LogicLearn</span><h2>Global settings</h2></div></header><c-logic-learn-settings></c-logic-learn-settings></div></template>

    <template lwc:if={showTutorialEditor}>
        <section class="modal-backdrop"><div class="modal-editor" onclick={stopPropagation}><c-logic-learn-tutorial-editor record-id={tutorialRecordId} onsaved={handleTutorialSaved} onclose={closeTutorialEditor}></c-logic-learn-tutorial-editor></div></section>
    </template>
</template>
