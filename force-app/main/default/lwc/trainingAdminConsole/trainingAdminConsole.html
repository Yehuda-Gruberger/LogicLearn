<template>
    <nav class="admin-tabs" aria-label="Administration">
        <button class={tutorialsTabClass} data-section="tutorials" onclick={handleSection}>Tutorials</button>
        <button class={groupsTabClass} data-section="groups" onclick={handleSection}>Groups</button>
        <button class={trackingTabClass} data-section="tracking" onclick={handleSection}>Tracking</button>
        <button class={settingsTabClass} data-section="settings" onclick={handleSection}>Settings</button>
    </nav>

    <template lwc:if={isTutorials}>
      <div class="console">
        <div class="panel">
            <div class="panel-head">
                <span class="panel-title">Folders</span>
                <lightning-button label="New Folder" icon-name="utility:add" onclick={handleNewFolder}></lightning-button>
            </div>
            <template lwc:if={hasFolders}>
                <ul class="folders">
                    <template for:each={folderList} for:item="f">
                        <li key={f.id} class={f.rowClass} style={f.indentStyle}>
                            <lightning-icon icon-name="utility:open_folder" size="x-small"></lightning-icon>
                            <span class="folder-name">{f.name}</span>
                            <div class="folder-actions">
                                <lightning-button-icon icon-name="utility:edit" alternative-text="Edit" title="Edit" variant="bare" data-id={f.id} onclick={handleEditFolder}></lightning-button-icon>
                                <lightning-button-icon icon-name="utility:delete" alternative-text="Delete" title="Delete" variant="bare" data-id={f.id} onclick={handleDeleteFolder}></lightning-button-icon>
                            </div>
                        </li>
                    </template>
                </ul>
            </template>
            <template lwc:else><p class="muted">No folders yet. Create one to organize your tutorials.</p></template>
        </div>

        <div class="panel">
            <div class="panel-head">
                <span class="panel-title">Tutorials</span>
                <lightning-button variant="brand" label="New Tutorial" icon-name="utility:add" onclick={handleNewVideo}></lightning-button>
            </div>
            <template lwc:if={hasVideos}>
                <lightning-datatable key-field="id" data={videos} columns={videoColumns} hide-checkbox-column onrowaction={handleVideoRowAction}></lightning-datatable>
            </template>
            <template lwc:else><p class="muted">No tutorials yet. Click New Tutorial to add one.</p></template>
        </div>
      </div>
    </template>
    <template lwc:elseif={isGroups}><c-logic-learn-group-manager></c-logic-learn-group-manager></template>
    <template lwc:elseif={isTracking}><c-logic-learn-tracking></c-logic-learn-tracking></template>
    <template lwc:else><c-logic-learn-settings></c-logic-learn-settings></template>

    <template lwc:if={showFolderForm}>
        <section class="modal-backdrop" onclick={closeFolderForm}>
            <div class="modal" onclick={stopPropagation}>
                <header class="modal-head"><span class="modal-title">{folderModalTitle}</span></header>
                <div class="form-body">
                    <lightning-input data-field="name" label="Name" value={folderForm.name} onchange={handleFolderField} required></lightning-input>
                    <c-logic-learn-picker label="Parent folder" placeholder="Search folders" options={folderOptions} value={folderForm.parentId} onchange={handleFolderParent}></c-logic-learn-picker>
                    <lightning-input data-field="sortOrder" type="number" label="Sort order" value={folderForm.sortOrder} onchange={handleFolderField}></lightning-input>
                    <lightning-input data-field="icon" label="Icon name (optional)" value={folderForm.icon} onchange={handleFolderField}></lightning-input>
                    <lightning-textarea data-field="description" label="Description" value={folderForm.description} onchange={handleFolderField}></lightning-textarea>
                </div>
                <div class="modal-foot">
                    <lightning-button label="Cancel" onclick={closeFolderForm}></lightning-button>
                    <lightning-button variant="brand" label="Save" onclick={handleFolderSaved} class="slds-m-left_x-small"></lightning-button>
                </div>
            </div>
        </section>
    </template>

    <template lwc:if={showTutorialEditor}>
        <section class="modal-backdrop">
            <div class="modal modal-editor" onclick={stopPropagation}>
                <c-logic-learn-tutorial-editor record-id={tutorialRecordId} onsaved={handleTutorialSaved} onclose={closeTutorialEditor}></c-logic-learn-tutorial-editor>
            </div>
        </section>
    </template>
</template>
