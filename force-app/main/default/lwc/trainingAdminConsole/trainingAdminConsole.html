<template>
    <template lwc:if={isTutorials}>
        <div class="master-detail">
            <aside class="video-browser">
                <header class="browser-brand"><span><lightning-icon icon-name="utility:video" size="small" variant="inverse"></lightning-icon></span><div><small>Training workspace</small><strong>LogicLearn</strong></div><button class="brand-settings" title="Global settings" onclick={openSettings}><lightning-icon icon-name="utility:settings" size="x-small" variant="inverse"></lightning-icon></button></header>
                <button class="create-top" onclick={handleNewVideo}><lightning-icon icon-name="utility:add" size="xx-small" variant="inverse"></lightning-icon><span>Create tutorial</span></button>
                <label class="video-search"><lightning-icon icon-name="utility:search" size="xx-small"></lightning-icon><input type="search" aria-label="Search tutorials" placeholder="Search tutorials" value={videoSearch} oninput={handleVideoSearch}/></label>
                <div class="browser-filters">
                    <c-logic-learn-picker multiple label="Folder" placeholder="All folders" options={browserFolderOptions} value={folderFilter} onchange={handleFolderFilter}></c-logic-learn-picker>
                    <c-logic-learn-picker multiple label="Category" placeholder="All categories" options={browserCategoryOptions} value={categoryFilter} onchange={handleCategoryFilter}></c-logic-learn-picker>
                    <c-logic-learn-picker multiple class="status-filter" label="Status" placeholder="All statuses" options={browserStatusOptions} value={statusFilter} onchange={handleStatusFilter}></c-logic-learn-picker>
                </div>
                <div class="browser-label"><span>Tutorials</span><span>{filteredVideoCount}</span></div>
                <div class="browser-list">
                    <template lwc:if={hasFilteredVideos}>
                        <template for:each={filteredTutorialRows} for:item="video">
                            <button key={video.id} class={video.rowClass} data-id={video.id} onclick={handleVideoSelect}>
                                <span class="browser-thumb" style={video.thumbStyle}>
                                    <template lwc:if={video.previewUrl}><video src={video.previewUrl} muted loop playsinline preload="metadata" onmouseenter={handleThumbnailEnter} onmouseleave={handleThumbnailLeave}></video></template>
                                    <span class="thumb-play"><lightning-icon icon-name="utility:play" size="xx-small" variant="inverse"></lightning-icon></span>
                                </span>
                                <span class="browser-copy"><span class="browser-copy-title"><strong>{video.title}</strong><span class={video.statusClass}>{video.status}</span></span><small>{video.meta} · {video.createdLabel}</small></span>
                            </button>
                        </template>
                    </template>
                    <template lwc:else><div class="browser-empty">No tutorials match these filters.</div></template>
                </div>
                <div class="browser-mode-toggle" role="group" aria-label="Workspace view"><button onclick={handleLibraryMode}>Library</button><button class="active">Admin</button></div>
            </aside>

            <main class="video-dashboard">
                <template lwc:if={detailLoading}><div class="dashboard-loading"><lightning-spinner alternative-text="Loading tutorial dashboard"></lightning-spinner></div></template>
                <template lwc:elseif={selectedTutorial}>
                    <header class="dashboard-header">
                        <div class="dashboard-heading"><div class="breadcrumb">{selectedTutorial.folderName} <span>/</span> {selectedTutorial.category}</div><div class="title-row"><h1>{selectedRow.title}</h1><span class={selectedRow.statusClass}>{selectedTutorial.status}</span></div><small>Created {selectedRow.createdLabel}</small></div>
                        <div class="dashboard-actions"><button class="edit-action" onclick={handleEditSelected}><lightning-icon icon-name="utility:edit" size="xx-small"></lightning-icon><span>Edit</span></button><button class="delete-action" title="Delete tutorial" onclick={handleDeleteSelected}><lightning-icon icon-name="utility:delete" size="xx-small"></lightning-icon></button></div>
                    </header>

                    <div class="dashboard-media">
                        <section class="video-stage"><div class="video-hero"><c-training-video-player video-id={selectedVideoId} preview-only compact onplay={handlePreviewPlay} onpause={handlePreviewPause}></c-training-video-player><template lwc:if={heroOverlayVisible}><button class="hero-play-button" onclick={handleHeroPlay}><span><lightning-icon icon-name="utility:play" size="small"></lightning-icon></span><strong>Play tutorial</strong></button></template></div></section>
                        <section class="engagement-card">
                            <header>Engagement</header>
                            <div class="engagement-metric teal"><div><span>Total opens</span><strong>{activitySummary.totalOpens}</strong></div><div class="metric-track"><span style={activitySummary.opensStyle}></span></div></div>
                            <div class="engagement-metric blue"><div><span>Started</span><strong>{activitySummary.started}</strong></div><div class="metric-track"><span style={activitySummary.startedStyle}></span></div></div>
                            <div class="engagement-metric green"><div><span>Completed</span><strong>{activitySummary.completed}</strong></div><div class="metric-track"><span style={activitySummary.completedStyle}></span></div></div>
                            <div class="engagement-metric purple"><div><span>Average watched</span><strong>{activitySummary.averageWatch}%</strong></div><div class="metric-track"><span style={activitySummary.averageStyle}></span></div></div>
                        </section>
                    </div>

                    <section class="summary-card audience-summary"><header><strong>Audience</strong><button onclick={handleEditSelected}>Manage</button></header><div class="summary-grid audience-grid"><div><small>Can view</small><strong title={selectedTutorial.visibilitySummary}>{selectedTutorial.visibilitySummary}</strong></div><div><small>Required</small><strong title={selectedTutorial.requiredSummary}>{selectedTutorial.requiredSummary}</strong></div><div><small>Notifications</small><strong title={selectedTutorial.notificationSummary}>{selectedTutorial.notificationSummary}</strong></div></div></section>
                    <section class="summary-card settings-summary"><header><strong>Settings</strong><button onclick={handleEditSelected}>Edit</button></header><div class="summary-grid settings-grid"><div><small>Completion</small><strong title={selectedTutorial.completionLabel}>{selectedTutorial.completionLabel}</strong></div><div><small>Skipping</small><strong title={selectedTutorial.skipLabel}>{selectedTutorial.skipLabel}</strong></div><div><small>Due date</small><strong title={selectedTutorial.dueDateLabel}>{selectedTutorial.dueDateLabel}</strong></div><div><small>Required audience</small><strong title={selectedTutorial.requiredPeopleLabel}>{selectedTutorial.requiredPeopleLabel}</strong></div><div><small>Source</small><strong title={selectedTutorial.contentType}>{selectedTutorial.contentType}</strong></div></div></section>
                </template>
                <template lwc:else>
                    <div class="dashboard-empty"><span><lightning-icon icon-name="utility:video" size="large" variant="inverse"></lightning-icon></span><h2>Create your first tutorial</h2><p>Add a video, choose its audience, and track engagement from this workspace.</p><lightning-button variant="brand" label="Create tutorial" icon-name="utility:add" onclick={handleNewVideo}></lightning-button></div>
                </template>
            </main>
            <aside class="people-sidebar">
                <template lwc:if={selectedTutorial}><c-logic-learn-tracking people compact video-id={selectedVideoId} ontrackingloaded={handleTrackingLoaded} onaddgroup={handleEditSelected} onassignpeople={handleEditSelected}></c-logic-learn-tracking></template>
                <template lwc:else><div class="people-placeholder"><lightning-icon icon-name="utility:people" size="medium"></lightning-icon><span>Select a tutorial to see its learners.</span></div></template>
            </aside>
        </div>
    </template>
    <template lwc:elseif={isGroups}><c-logic-learn-group-manager></c-logic-learn-group-manager></template>

    <template lwc:if={showSettingsModal}>
        <section class="settings-backdrop" onclick={closeSettings}>
            <div class="settings-modal" onclick={stopPropagation}>
                <header><div class="settings-heading"><span class="settings-mark"><lightning-icon icon-name="utility:settings" size="x-small"></lightning-icon></span><div><span class="eyebrow">LogicLearn</span><h2>Global settings</h2><p>Organization-wide defaults. Individual tutorials can override completion and skipping.</p></div></div><lightning-button-icon icon-name="utility:close" alternative-text="Close settings" title="Close" variant="bare" onclick={closeSettings}></lightning-button-icon></header>
                <div class="settings-modal-body"><c-logic-learn-settings onclose={closeSettings}></c-logic-learn-settings></div>
            </div>
        </section>
    </template>

    <template lwc:if={showTutorialEditor}>
        <section class="modal-backdrop"><div class="modal-editor" onclick={stopPropagation}><c-logic-learn-tutorial-editor record-id={tutorialRecordId} onsaved={handleTutorialSaved} onclose={closeTutorialEditor}></c-logic-learn-tutorial-editor></div></section>
    </template>
</template>
